      historyEdits.push(historyEdit);
      historyTimeCell.appendChild(historyTimeText);
      historyTimeCell.appendChild(el("div", {class:"history-time-editor"}, [historyTimeInput, historyPickerButton]));
      historyTimeCell.appendChild(historyRowError);
      item.appendChild(historyTimeCell);
      var historyStatusCell = el("div", {class:"history-status-cell"});
      if(h.from !== null){
        historyStatusCell.appendChild(statusBadge(h.from));
        historyStatusCell.appendChild(el("span", {class:"h-arrow", role:"img", "aria-label":"chuyển sang"}, [icon("arrowRight")]));
      }
      historyStatusCell.appendChild(statusBadge(h.to));
      item.appendChild(historyStatusCell);
      var historyActions = el("div", {class:"history-actions"});
      var historyEditButton = el("button", {type:"button", class:"history-edit-btn", title:"Sửa thời gian", "aria-label":"Sửa thời gian hoạt động"}, [icon("pencil")]);
      var historyConfirmButton = el("button", {type:"button", class:"history-confirm-btn", title:"Xác nhận chỉnh sửa", "aria-label":"Xác nhận chỉnh sửa thời gian hoạt động"}, [icon("check")]);
      var historyCancelButton = el("button", {type:"button", class:"history-cancel-btn", title:"Hủy sửa", "aria-label":"Hủy sửa thời gian hoạt động"}, [icon("close")]);
      historyEditButton.addEventListener("click", function(){
        item.classList.add("is-editing");
        historyEditButton.style.display = "none";
        historyConfirmButton.style.display = "inline-flex";
        historyCancelButton.style.display = "inline-flex";
        historyTimeInput.focus();
        validateHistoryOrder(true);
      });
      historyConfirmButton.addEventListener("click", function(){
        if(!validateHistoryOrder(true)) return;
        var iso = historyEditIso(historyEdit);
        if(!iso) return;
        historyEdit.draftIso = iso;
        historyTimeInput.value = fmtDateTime(iso);
        historyTimeText.textContent = fmtDateTime(iso);
        item.classList.toggle("is-draft", iso !== h.at);
        refreshDraftNotice();
        item.classList.remove("is-editing");
        historyEditButton.style.display = "inline-flex";
        historyConfirmButton.style.display = "none";
        historyCancelButton.style.display = "none";
      });
      historyCancelButton.addEventListener("click", function(){
        historyTimeInput.value = fmtDateTime(historyEdit.draftIso);
        historyTimeText.textContent = fmtDateTime(historyEdit.draftIso);
        item.classList.toggle("is-draft", historyEdit.draftIso !== h.at);
        refreshDraftNotice();
        item.classList.remove("is-editing");
        historyEditButton.style.display = "inline-flex";
        historyConfirmButton.style.display = "none";
        historyCancelButton.style.display = "none";
        validateHistoryOrder(false);
      });
      historyConfirmButton.style.display = "none";
      historyCancelButton.style.display = "none";
      historyActions.appendChild(historyEditButton);
      historyActions.appendChild(historyConfirmButton);
      historyActions.appendChild(historyCancelButton);
      item.appendChild(historyActions);
      histList.appendChild(item);
    });
    histField.appendChild(histList);
    function historyEditIso(edit){
      var currentInputValue = edit.input.value;
      var draftInputValue = fmtDateTime(edit.draftIso);
      return currentInputValue === draftInputValue ? edit.draftIso : fromDisplayDateTime(currentInputValue);
    }
    function validateHistoryOrder(showError){
      var orderedHistoryTimes = task.history.map(function(history){
        var edit = historyEdits.find(function(item){ return item.history === history; });
        return edit ? historyEditIso(edit) : history.at;
      });
      var valid = true;
      function markHistoryError(edit, message){
        if(!edit) return;
        edit.input.classList.add("input-invalid");
        edit.error.textContent = message;
        if(showError && edit.item.classList.contains("is-editing")) edit.error.classList.add("show");
      }
      historyEdits.forEach(function(edit){
        edit.input.classList.remove("input-invalid");
        edit.error.classList.remove("show");
        edit.error.textContent = "";
      });
      orderedHistoryTimes.forEach(function(iso, index){
        if(!iso){
          valid = false;
          var emptyEdit = historyEdits.find(function(item){ return item.history === task.history[index]; });
          markHistoryError(emptyEdit, "Nhập thời gian dạng dd/mm/yyyy HH:mm (24 giờ).");
          return;
        }
        if(index > 0 && new Date(iso).getTime() < new Date(orderedHistoryTimes[index - 1]).getTime()){
          valid = false;
          var currentEdit = historyEdits.find(function(item){ return item.history === task.history[index]; });
          var previousEdit = historyEdits.find(function(item){ return item.history === task.history[index - 1]; });
          markHistoryError(currentEdit, "Thời gian phải bằng hoặc sau hoạt động trước.");
          if(previousEdit && previousEdit.item.classList.contains("is-editing")){
            markHistoryError(previousEdit, "Thời gian phải bằng hoặc trước hoạt động sau.");
          }
        }
      });
      return valid;
    }
    historyEdits.forEach(function(edit){
      edit.input.addEventListener("input", function(){ validateHistoryOrder(true); });
    });
    validateHistoryOrder(false);
    colRight.appendChild(histField);
    colRight.appendChild(el("div", {class:"activity-footer"}, [
      el("span", {class:"activity-footer-icon", "aria-hidden":"true"}, ["i"]),
      el("span", {}, ["Xác nhận bằng dấu tích, sau đó nhấn Lưu thay đổi để áp dụng."])
    ]));

    cols.appendChild(colLeft);
    cols.appendChild(colRight);
    body.appendChild(cols);

    modal.appendChild(body);

    var footer = el("div", {class:"modal-footer"});
    footer.appendChild(el("button", {class:"btn btn-danger", onclick: function(){
      showConfirm("Bạn có chắc muốn xóa công việc \"" + task.title + "\"? Hành động này không thể hoàn tác.", {
        title: "Xóa công việc",
        tone: "danger",
        okLabel: "Xóa công việc",
        onOk: function(){
          deleteTask(task.id);
          state.activeTaskId = null;
          render();
        }
      });
    }}, ["Xóa công việc"]));

    var rightBtns = el("div", {});
    rightBtns.appendChild(el("button", {class:"btn btn-outline", style:"margin-right:8px;", onclick: closeModal}, ["Đóng lại"]));
    rightBtns.appendChild(el("button", {class:"btn btn-primary", onclick: function(){
      var editingHistory = historyEdits.filter(function(edit){ return edit.item.classList.contains("is-editing"); });
      if(editingHistory.length){
        showDetailPane("activity");
        editingHistory.forEach(function(edit){
          edit.error.textContent = "Vui lòng nhấn ✓ để xác nhận hoạt động đang sửa trước khi lưu.";
          edit.error.classList.add("show");
        });
        return;
      }
      if(!validateHistoryOrder(false)) return;
      var historyTimes = [];
      historyEdits.forEach(function(edit){
        var iso = historyEditIso(edit);
        historyTimes.push({index:task.history.indexOf(edit.history), iso:iso});
      });
      var reminderText = reminderInput.value.trim();
      var reminderChanged = reminderText !== (task.reminderAt ? fmtDateTime(task.reminderAt) : "");
      var reminderIso = reminderChanged ? (reminderText ? fromDisplayDateTime(reminderText) : null) : (task.reminderAt || null);
      if(reminderChanged && reminderText && !reminderIso){
        showDetailPane("info");
        reminderError.textContent = "Nhập thời điểm nhắc dạng dd/mm/yyyy HH:mm (24 giờ).";
        reminderError.classList.add("show");
        reminderInput.classList.add("input-invalid");
        reminderInput.focus();
        return;
      }
      if(reminderChanged && reminderIso && new Date(reminderIso).getTime() <= Date.now()){
        showDetailPane("info");
        reminderError.textContent = "Thời gian nhắc nhở phải ở trong tương lai.";
        reminderError.classList.add("show");
        reminderInput.classList.add("input-invalid");
        reminderInput.focus();
        return;
      }
      var newStatus = selectedStatus;
      if(newStatus !== task.status && !canChangeStatus(task.status, newStatus)){
        refreshStatusValidation();
        return;
      }
      var executionDateValue = fromDisplayDate(executionInput.value);
      if(!executionDateValue){
        executionError.classList.add("show");
        executionInput.focus();
        return;
      }
      updateTaskHistoryTimes(task.id, historyTimes);
      updateTaskFields(task.id, titleInput.value.trim() || task.title, descArea.value, reminderIso);
      updateTaskExecutionDate(task.id, executionDateValue);
      if(newStatus !== task.status){
        if(newStatus === "trash"){
          moveTaskToTrash(task.id, function(){ state.activeTaskId = null; });
          return;
        }
        if(!setStatus(task.id, newStatus)){
          refreshStatusValidation();
          return;
        }
      }
      state.activeTaskId = null;
      render();
    }}, ["Lưu thay đổi"]));
    footer.appendChild(rightBtns);
    modal.appendChild(footer);

    overlay.appendChild(modal);
    modalRoot.innerHTML = "";
    modalRoot.appendChild(overlay);
    scrollDetailDaysToEnd(modal);
  }

  function closeModal(){
    state.activeTaskId = null;
    state.bulkOpen = false;
    modalRoot.innerHTML = "";
  }
  function openTaskDetail(taskId){
    var task = getTaskById(taskId);
    if(!task) return;
    state.activeTaskId = task.id;
    renderTaskModal();
  }

  // ---------- bulk add modal ----------
  function openBulkModal(){
    state.bulkOpen = true;
    renderBulkModal();
  }
  function renderBulkModal(){
    var overlay = el("div", {class:"modal-overlay", onclick:function(e){ if(e.target===overlay) closeModal(); }});
    var modal = el("div", {class:"modal modal-lg modal-bulk", role:"dialog", "aria-modal":"true", "aria-label":"Thêm nhiều việc cùng lúc"});
    modal.appendChild(dialogHeader("Thêm nhiều việc cùng lúc", "Nhập danh sách và chọn ngày thực hiện cho các việc mới.", "TẠO CÔNG VIỆC", closeModal));

    var body = el("div", {class:"modal-body"});
    var field = el("div", {class:"field"});
    field.appendChild(el("label", {}, ["Mỗi dòng là một công việc"]));
    var area = el("textarea", {class:"textarea-lines", placeholder:"Ví dụ:\nChuẩn bị báo cáo tuần\nKiểm tra tiến độ dự án"});
    field.appendChild(area);
    var bulkError = el("div", {class:"field-error"}, ["Vui lòng nhập ít nhất một công việc."]);
    field.appendChild(bulkError);
    area.addEventListener("input", function(){ bulkError.classList.remove("show"); area.classList.remove("input-invalid"); });
    body.appendChild(field);

    var row1 = el("div", {class:"row2"});
    var dateField = el("div", {class:"field"});
    dateField.appendChild(el("label", {}, ["Ngày thực hiện"]));
    var dateInput = el("input", {type:"text", value:fmtDate(new Date()), placeholder:"dd/mm/yyyy", inputmode:"numeric", autocomplete:"off", "aria-label":"Ngày thực hiện (dd/mm/yyyy)"});
    dateField.appendChild(createDateControl(dateInput, {buttonLabel:"Chọn ngày thực hiện"}));
    var dateError = el("div", {class:"field-error"}, ["Nhập ngày thực hiện dạng dd/mm/yyyy."]);
    dateField.appendChild(dateError);
    dateInput.addEventListener("input", function(){ dateError.classList.remove("show"); });
    row1.appendChild(dateField);

    body.appendChild(row1);

    modal.appendChild(body);

    var footer = el("div", {class:"modal-footer"});
    footer.appendChild(el("button", {class:"btn btn-outline", onclick: closeModal}, ["Hủy bỏ"]));
    footer.appendChild(el("button", {class:"btn btn-primary", onclick: function(){
      var lines = area.value.split("\n").map(function(l){ return l.trim(); }).filter(function(l){ return l.length; });
      if(!lines.length){
        bulkError.classList.add("show");
        area.classList.add("input-invalid");
        area.focus();
        return;
      }
      var dateValue = fromDisplayDate(dateInput.value);
      if(!dateValue){
        dateError.classList.add("show");
        dateInput.focus();
        return;
      }
      var startIso = occurrenceStartDate(dateValue);
      addTasksBulk(lines, "todo", startIso);
      closeModal();
      render();
    }}, ["Thêm công việc"]));
    modal.appendChild(footer);

    overlay.appendChild(modal);
    modalRoot.innerHTML = "";
    modalRoot.appendChild(overlay);
  }

  // ---------- cuộn ngang bằng chuột: thanh cuộn bị ẩn nên cho giữ chuột kéo, mép mờ báo còn nội dung ----------
  var dragScroll = null;
  function updateScrollHints(element){
    var max = element.scrollWidth - element.clientWidth;
    element.classList.toggle("can-scroll-left", max > 1 && element.scrollLeft > 1);
    element.classList.toggle("can-scroll-right", max > 1 && element.scrollLeft < max - 1);
  }
  function refreshScrollHints(){
    requestAnimationFrame(function(){ document.querySelectorAll(".drag-scroll").forEach(updateScrollHints); });
  }
  function scrollDetailDaysToEnd(container){
    var row = container.querySelector(".detail-days-row");
    if(row) row.scrollLeft = row.scrollWidth;
    refreshScrollHints();
  }
  function initDragScroll(){
    document.addEventListener("pointerdown", function(event){
      if(event.pointerType !== "mouse" || event.button !== 0) return;
      var element = event.target.closest(".drag-scroll");
      if(!element || element.scrollWidth <= element.clientWidth + 1 || event.target.closest("input, textarea, select")) return;
      dragScroll = {element:element, pointerId:event.pointerId, startX:event.clientX, startLeft:element.scrollLeft, moved:false};
    });
    document.addEventListener("pointermove", function(event){
      if(!dragScroll || event.pointerId !== dragScroll.pointerId) return;
      var distance = event.clientX - dragScroll.startX;
      if(!dragScroll.moved && Math.abs(distance) < 5) return;
      if(!dragScroll.moved){
        dragScroll.moved = true;
        dragScroll.element.classList.add("is-dragging");
        try{ dragScroll.element.setPointerCapture(event.pointerId); }catch(e){}
      }
      dragScroll.element.scrollLeft = dragScroll.startLeft - distance;
      event.preventDefault();
    });
    function endDrag(){
      if(!dragScroll) return;
      var finished = dragScroll;
      dragScroll = null;
      finished.element.classList.remove("is-dragging");
      if(!finished.moved) return;
      // nuốt cú click phát sinh khi thả chuột để không mở nhầm công việc
      var swallowClick = function(event){ event.preventDefault(); event.stopPropagation(); };
      document.addEventListener("click", swallowClick, true);
      setTimeout(function(){ document.removeEventListener("click", swallowClick, true); }, 0);
    }
    document.addEventListener("pointerup", endDrag);
    document.addEventListener("pointercancel", endDrag);
    // khung nhỏ chỉ cuộn ngang (.wheel-x): lăn chuột thì cuộn ngang, tới mép thì trả lại cho trang
    document.addEventListener("wheel", function(event){
      var element = event.target.closest && event.target.closest(".wheel-x");
      if(!element || event.ctrlKey || Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
      var before = element.scrollLeft;
      element.scrollLeft += event.deltaY;
      if(element.scrollLeft !== before) event.preventDefault();
    }, {passive:false});
    document.addEventListener("scroll", function(event){
      if(event.target.classList && event.target.classList.contains("drag-scroll")) updateScrollHints(event.target);
    }, true);
    window.addEventListener("resize", refreshScrollHints);
  }

  // ---------- main render ----------
  function render(){
    app.innerHTML = "";
    state.workViewApi = null;
    state.reportViewApi = null;
    if(state.migrationWarning){
      app.appendChild(el("div", {class:"migration-warning", role:"alert"}, [
        "Không thể chuyển dữ liệu cũ an toàn. Dữ liệu gốc chưa bị ghi đè; hãy kiểm tra dung lượng lưu trữ hoặc bản dữ liệu cũ rồi tải lại trang."
      ]));
      modalRoot.innerHTML = "";
      return;
    }
    Object.keys(VIEW_LABELS).forEach(function(view){
      var tab = document.getElementById("tab-" + view);
      tab.classList.toggle("active", state.view === view);
      if(state.view === view) tab.setAttribute("aria-current", "page");
      else tab.removeAttribute("aria-current");
    });
    var openCount = state.tasks.filter(function(t){ return t.status === "todo" || t.status === "inprogress" || t.status === "pending"; }).length;
    document.getElementById("work-count").textContent = openCount ? String(openCount) : "";
    if(state.view === "work") renderWorkView();
    else if(state.view === "calendar") renderCalendarView();
    else if(state.view === "settings") renderSettingsView();
    else renderReportView();

    if(state.activeTaskId) renderTaskModal();
    else if(state.bulkOpen) renderBulkModal();
    else modalRoot.innerHTML = "";
    refreshScrollHints();
  }

  Object.keys(VIEW_LABELS).forEach(function(view){
    document.getElementById("tab-" + view).addEventListener("click", function(){ state.view = view; render(); });
  });

  // ---------- init ----------
  initDragScroll();
  document.addEventListener("pointerdown", function(){ lastInputWasKeyboard = false; }, true);
  document.addEventListener("keydown", function(event){
    if(!event.altKey && !event.ctrlKey && !event.metaKey) lastInputWasKeyboard = true;
  }, true);
  state.settings = loadSettings();
  state.view = state.settings.startView;
  applySettings();
  document.getElementById("theme-toggle").addEventListener("click", function(){
    state.settings.mode = resolvedTheme() === "dark" ? "light" : "dark";
    saveSettings();
    applySettings();
    if(state.view === "settings") render();
  });
  var themeQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  if(themeQuery){
    var followSystemTheme = function(){ if(state.settings.mode === "system") applySettings(); };
    if(themeQuery.addEventListener) themeQuery.addEventListener("change", followSystemTheme);
    else if(themeQuery.addListener) themeQuery.addListener(followSystemTheme);
  }

  state.tasks = loadTasks();
  migrateLegacyData();
  render();
  if(!state.migrationWarning){
    checkReminders();
    setInterval(checkReminders, 15000);
  }
  setInterval(updateLiveTimingDisplays, 1000);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) updateLiveTimingDisplays();
  });
})();
</script>
</body>
</html>
