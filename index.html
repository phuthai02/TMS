  function durationText(ms){

    var hours = Math.floor(mins/60); mins -= hours*60;
    if(days) return days + " ngày" + (hours ? " " + hours + " giờ" : "");
    if(hours) return hours + " giờ" + (mins ? " " + mins + " phút" : "");
    return mins ? mins + " phút" : "dưới 1 phút";
  }
  function exactDurationText(ms){

    var parts = [];
    if(days) parts.push(days+" ngày");
    if(hours) parts.push(hours+" giờ");

  function taskTimingSummary(task, nowMs){
    if(nowMs === undefined) nowMs = Date.now();

    var deletedAt = null;
    var inprogressMs = 0;
    var pendingMs = 0;
    var currentPendingMs = null;
    var currentInprogressMs = null;
    var hasInprogress = false;
    var hasPending = false;
    history.forEach(function(event, index){
      var at = new Date(event.at).getTime();
      if(!Number.isFinite(at)) return;
      if(event.to === "inprogress" && !startAt) startAt = event.at;
      if(event.to === "done" || event.to === "closed") completedAt = event.at;
      if(event.to === "trash") deletedAt = event.at;
      if(event.to !== "inprogress" && event.to !== "pending") return;

  function updateTaskExecutionDate(taskId, dateValue){

    var next = new Date(dateValue + "T12:00:00");
    if(isNaN(next.getTime()) || dateKey(next) !== dateValue) return false;

  // ---------- dòng thời gian dựng lại từ lịch sử: trả lời "ngày đó mình đang làm gì" ----------
  var DAY_MS = 86400000;
  var ACTIVE_STATUSES = {todo:true, inprogress:true, pending:true};
  var FINAL_STATUSES = {done:true, closed:true, trash:true};
  function sortedHistory(task){
    return (Array.isArray(task.history) ? task.history.slice() : [])
      .sort(function(a, b){ return new Date(a.at) - new Date(b.at); });
  }
  function dayStartMs(time){ return startOfDay(time).getTime(); }
  function dayDiff(fromTime, toTime){ return Math.round((dayStartMs(toTime) - dayStartMs(fromTime)) / DAY_MS); }
  function statusAtTime(task, time){
    var result = {status:null, since:null};
    sortedHistory(task).forEach(function(h){
      var at = new Date(h.at).getTime();
      if(at <= time){ result.status = h.to; result.since = at; }
    });
    return result;
  }
  // từ lần đầu bắt đầu làm tới lần kết thúc cuối cùng; end = null khi việc vẫn đang mở
  function workSpan(task){
    var history = sortedHistory(task);
    var start = null;
    history.forEach(function(h){ if(start === null && h.to === "inprogress") start = new Date(h.at).getTime(); });
    var last = history[history.length - 1];
    var end = start !== null && last && FINAL_STATUSES[last.to] ? new Date(last.at).getTime() : null;
    return {start:start, end:end};
  }
  function workedOnDay(task, dayMs){
    var history = sortedHistory(task);
    var dayEnd = dayMs + DAY_MS - 1;
    return history.some(function(h, index){
      if(h.to !== "inprogress" && h.to !== "pending") return false;
      var from = new Date(h.at).getTime();
      var to = history[index + 1] ? new Date(history[index + 1].at).getTime() : Date.now();
      return from <= dayEnd && to >= dayMs && from <= Date.now();
    });
  }
  function doneOnDay(task, dayMs){
    return sortedHistory(task).some(function(h){ return h.to === "done" && dayStartMs(h.at) === dayMs; });
  }
  function spanLabelForDay(task, dayMs){
    var span = workSpan(task);
    if(span.start === null) return "";
    var first = dayStartMs(span.start);
    var last = dayStartMs(span.end !== null ? span.end : Date.now());
    if(dayMs < first || dayMs > last) return "";
    var index = dayDiff(first, dayMs) + 1;
    if(span.end !== null){
      var total = dayDiff(first, last) + 1;
      return total > 1 ? "Ngày " + index + "/" + total : "";
    }
    return index > 1 ? "Ngày " + index : "";
  }
  function spanLabelForRange(task, range){
    var span = workSpan(task);
    if(span.start === null || !range[0]) return "";
    var from = Math.max(dayStartMs(span.start), range[0].getTime());
    var to = Math.min(dayStartMs(span.end !== null ? span.end : Date.now()), dayStartMs(range[1]));
    if(to < from) return "";
    var days = dayDiff(from, to) + 1;
    return days > 1 ? days + " ngày trong kỳ" : "";
  }
  function longDayLabel(time){
    var weekdays = ["Chủ nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
    return weekdays[new Date(time).getDay()] + ", " + fmtDate(new Date(time).toISOString());
  }
  function shortWeekday(time){ return ["CN", "T2", "T3", "T4", "T5", "T6", "T7"][new Date(time).getDay()]; }
  function compareCards(a, b){
    var sort = state.settings.sort;
    if(sort === "name") return a.title.localeCompare(b.title, "vi");
    if(sort === "date") return new Date(occurrenceDateOf(a)) - new Date(occurrenceDateOf(b));
    return new Date(statusEnteredAt(b)) - new Date(statusEnteredAt(a));
  }

  // ---------- rendering ----------
  var app = document.getElementById("app");
  var modalRoot = document.getElementById("modal-root");
  var confirmRoot = document.getElementById("confirm-root");
  var reminderRoot = document.getElementById("reminder-root");
  var listModalRoot = document.getElementById("list-modal-root");

  function el(tag, attrs, children){
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k === "class") node.className = attrs[k];
      else if(k === "html") node.innerHTML = attrs[k];
      else if(k.indexOf("on") === 0 && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){
      if(c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  // nền nhạt từ màu trạng thái (màu là biến CSS nên không ghép hex alpha được)
  function tint(color, percent){
    return "color-mix(in srgb, " + color + " " + percent + "%, transparent)";
  }
  function statusBadge(key){
    var s = STATUS_MAP[key] || {label:key, color:"var(--status-closed)", ink:"var(--status-closed-ink)"};
    return el("span", {class:"badge", style:"background:"+tint(s.color, 14)+";color:"+s.ink}, [s.label]);
  }
  function progressCircle(pct, status){
    var s = STATUS_MAP[status] || {color:"var(--text-muted)", ink:"var(--text-dim)"};
    var circle = el("div", {class:"progress-circle", style:"--progress:"+pct+"%;--progress-color:"+s.color+";"});
    circle.appendChild(el("span", {class:"progress-pct", style:"color:"+s.ink}, [pct+"%"]));
    return circle;
  }
  function progressBar(pct, status){
    var s = STATUS_MAP[status];
    var meta = el("div", {class:"t-meta"});
    var track = el("div", {class:"progress-track"});
    track.appendChild(el("div", {class:"progress-fill", style:"width:"+pct+"%;background:"+s.color}));
    meta.appendChild(track);
    meta.appendChild(el("span", {class:"progress-pct", style:"color:"+s.ink}, [pct+"%"]));
    return meta;
  }

  // dropdown trạng thái tự dựng (thay <select> native để kiểm soát được giao diện của danh sách)
  function createStatusDropdown(optionList, currentKey, onChange){
    var wrapper = el("div", {class:"custom-select"});
    var trigger = el("button", {type:"button", class:"custom-select-trigger"});
    var menu = el("div", {class:"custom-select-menu"});
    var currentValue = currentKey;

    function paintTrigger(){
      var s = STATUS_MAP[currentValue];
      trigger.textContent = s.label;
      trigger.style.backgroundColor = tint(s.color, 14);
      trigger.style.color = s.ink;
    }
    paintTrigger();

    optionList.forEach(function(s){
      var opt = el("div", {class:"custom-select-option"});
      opt.appendChild(el("span", {class:"dot", style:"background:"+s.color}));
      opt.appendChild(el("span", {style:"color:"+s.ink+";"}, [s.label]));
      function selectOption(){
        currentValue = s.key;
        paintTrigger();
        menu.classList.remove("open");
        if(onChange) onChange(currentValue);
      }
      opt.addEventListener("pointerdown", function(e){
        if(e.button === 0) selectOption();
      });
      opt.addEventListener("click", selectOption);
      menu.appendChild(opt);
    });

    trigger.addEventListener("click", function(){ menu.classList.toggle("open"); });
    wrapper.addEventListener("keydown", function(e){ if(e.key === "Escape") menu.classList.remove("open"); });
    wrapper.addEventListener("focusout", function(){
      setTimeout(function(){
        if(!wrapper.contains(document.activeElement)) menu.classList.remove("open");
      }, 0);
    });

    wrapper.appendChild(trigger);
    wrapper.appendChild(menu);
    wrapper.getValue = function(){ return currentValue; };
    return wrapper;
  }

  // ---------- svg helper + status pie chart ----------
  function svgEl(tag, attrs, children){
    var node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){ node.setAttribute(k, attrs[k]); });
    (children||[]).forEach(function(c){ if(c) node.appendChild(c); });
    return node;
  }
  // icon nét (Lucide), dùng thay cho ký tự ✕ ‹ › → ✎ ✓

  function icon(name){
    return svgEl("svg", {class:"icon", viewBox:"0 0 24 24", fill:"none", stroke:"currentColor", "stroke-width":"2", "stroke-linecap":"round", "stroke-linejoin":"round", "aria-hidden":"true"}, [

  function calendarIcon(){

  // ---------- bộ chọn ngày giờ dùng chung: luôn dd/mm/yyyy, 24 giờ, tiếng Việt, không phụ thuộc ngôn ngữ trình duyệt ----------
  var activeDatePicker = null;
  function closeDatePicker(restoreFocus){
    var picker = activeDatePicker;
    if(!picker) return;
    activeDatePicker = null;
    picker.root.remove();
    document.removeEventListener("mousedown", picker.onOutside, true);
    document.removeEventListener("scroll", picker.onScroll, true);
    window.removeEventListener("resize", picker.onResize);
    if(restoreFocus && picker.anchor && picker.anchor.isConnected) picker.anchor.focus({preventScroll:true});
  }
  function parseTimeText(value){
    var match = /^([01]?\d|2[0-3]):?([0-5]\d)$/.exec((value || "").trim());
    return match ? {hours:Number(match[1]), minutes:Number(match[2])} : null;
  }
  function addDaysTo(date, days){
    var next = new Date(date);
    next.setDate(next.getDate() + days);
    return next;
  }
  // options: anchor, mode ("day" | "week" | "month" | "year" | "range"), value, rangeValue, withTime, clearable, label, onPick(kết quả | null)
  function openDatePicker(options){
    closeDatePicker(false);
    var mode = options.mode || "day";
    var today = startOfDay(new Date());
    var selected = options.value ? new Date(options.value) : null;
    var range = options.rangeValue && options.rangeValue[0] ? [startOfDay(options.rangeValue[0]), startOfDay(options.rangeValue[1])] : null;
    var rangeStart = null;
    var focusDate = startOfDay(selected || (range && range[0]) || today);
    var viewDate = new Date(focusDate.getFullYear(), focusDate.getMonth(), 1);
    var root = el("div", {class:"date-picker" + (lastInputWasKeyboard ? "" : " is-pointer"), role:"dialog", "aria-modal":"false", "aria-label":options.label || "Chọn ngày"});
    var picker = {root:root, anchor:options.anchor, openedAt:Date.now()};
    activeDatePicker = picker;

    function finish(result){
      closeDatePicker(true);
      options.onPick(result);
    }
    var prevButton = el("button", {type:"button", class:"icon-btn dp-nav", onclick:function(){ step(-1); }}, [icon("chevronLeft")]);
    var nextButton = el("button", {type:"button", class:"icon-btn dp-nav", onclick:function(){ step(1); }}, [icon("chevronRight")]);
    var title = el("div", {class:"dp-title", "aria-live":"polite"});
    var grid = el("div", {class:"dp-grid", role:"grid"});
    var hint = el("p", {class:"dp-hint"});
    root.appendChild(el("div", {class:"dp-head"}, [prevButton, title, nextButton]));
    root.appendChild(grid);
    root.appendChild(hint);

    function step(direction){
      if(mode === "month") viewDate = new Date(viewDate.getFullYear() + direction, 0, 1);
      else if(mode === "year") viewDate = new Date(viewDate.getFullYear() + 12 * direction, 0, 1);
      else viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + direction, 1);
      draw(null);
    }
    function moveFocus(next){
      focusDate = startOfDay(next);
      if(mode === "month" || mode === "year") viewDate = new Date(focusDate.getFullYear(), 0, 1);
      else viewDate = new Date(focusDate.getFullYear(), focusDate.getMonth(), 1);
      draw(focusDate);
    }
    function onGridKey(event, date){
      var next = null;
      if(mode === "month"){
        var monthStep = {ArrowLeft:-1, ArrowRight:1, ArrowUp:-3, ArrowDown:3}[event.key];
        if(monthStep) next = new Date(date.getFullYear(), date.getMonth() + monthStep, 1);
        if(event.key === "PageUp" || event.key === "PageDown") next = new Date(date.getFullYear() + (event.key === "PageUp" ? -1 : 1), date.getMonth(), 1);
      } else if(mode === "year"){
        var yearStep = {ArrowLeft:-1, ArrowRight:1, ArrowUp:-3, ArrowDown:3}[event.key];
        if(yearStep) next = new Date(date.getFullYear() + yearStep, 0, 1);
        if(event.key === "PageUp" || event.key === "PageDown") next = new Date(date.getFullYear() + (event.key === "PageUp" ? -12 : 12), 0, 1);
      } else {
        var dayStep = {ArrowLeft:-1, ArrowRight:1, ArrowUp:-7, ArrowDown:7}[event.key];
        if(dayStep) next = addDaysTo(date, dayStep);
        if(event.key === "PageUp" || event.key === "PageDown"){
          next = new Date(date);
          next.setMonth(next.getMonth() + (event.key === "PageUp" ? -1 : 1) * (event.shiftKey ? 12 : 1));
        }
        if(event.key === "Home") next = startOfWeek(date);
        if(event.key === "End") next = addDaysTo(startOfWeek(date), 6);
      }
      if(!next) return;
      event.preventDefault();
      moveFocus(next);
    }
    function pickDay(day){
      if(mode === "range"){
        if(!rangeStart){
          rangeStart = day;
          range = [day, day];
          focusDate = day;
          draw(day);
          return;
        }
        finish(rangeStart <= day ? [rangeStart, day] : [day, rangeStart]);
        return;
      }
      if(options.withTime){
        selected = day;
        focusDate = day;
        draw(day);
        return;
      }
      finish(day);
    }
    function cellButton(date, label, aria, classes, pressed, onPick){
      var focused = mode === "month" ? date.getFullYear() === focusDate.getFullYear() && date.getMonth() === focusDate.getMonth()
        : mode === "year" ? date.getFullYear() === focusDate.getFullYear()
        : dayStartMs(date) === dayStartMs(focusDate);
      var button = el("button", {
        type:"button", role:"gridcell", class:classes, "aria-label":aria, "aria-pressed":String(pressed),
        tabindex:focused ? "0" : "-1", "data-time":String(date.getTime()),
        onclick:onPick, onkeydown:function(event){ onGridKey(event, date); }
      }, [label]);
      return button;
    }
    function previewRange(hoverDay){
      if(mode !== "range" || !rangeStart) return;
      var from = Math.min(rangeStart.getTime(), hoverDay.getTime());
      var to = Math.max(rangeStart.getTime(), hoverDay.getTime());
      grid.querySelectorAll(".dp-day").forEach(function(button){
        var time = Number(button.getAttribute("data-time"));
        button.classList.toggle("is-in-range", time >= from && time <= to);
      });
    }
    function draw(focusTarget){
      grid.replaceChildren();
      if(mode === "month" || mode === "year"){
        var year = viewDate.getFullYear();
        var firstYear = Math.floor(year / 12) * 12;
        title.textContent = mode === "month" ? "Năm " + year : firstYear + " – " + (firstYear + 11);
        prevButton.setAttribute("aria-label", mode === "month" ? "Năm trước" : "12 năm trước");
        nextButton.setAttribute("aria-label", mode === "month" ? "Năm sau" : "12 năm sau");
        grid.className = "dp-grid dp-cells";
        for(var index = 0; index < 12; index++){
          var cellDate = mode === "month" ? new Date(year, index, 1) : new Date(firstYear + index, 0, 1);
          var isCurrent = mode === "month" ? cellDate.getFullYear() === today.getFullYear() && index === today.getMonth() : cellDate.getFullYear() === today.getFullYear();
          var isSelected = !!selected && (mode === "month" ? selected.getFullYear() === year && selected.getMonth() === index : selected.getFullYear() === cellDate.getFullYear());
          grid.appendChild(cellButton(cellDate,
            mode === "month" ? "Tháng " + (index + 1) : String(cellDate.getFullYear()),
            mode === "month" ? "Tháng " + (index + 1) + " năm " + year : "Năm " + cellDate.getFullYear(),
            "dp-cell" + (isCurrent ? " is-today" : "") + (isSelected ? " is-selected" : ""), isSelected,
            (function(value){ return function(){ finish(value); }; })(cellDate)));
        }
      } else {
        title.textContent = "Tháng " + (viewDate.getMonth() + 1) + ", " + viewDate.getFullYear();
        prevButton.setAttribute("aria-label", "Tháng trước");
        nextButton.setAttribute("aria-label", "Tháng sau");
        grid.className = "dp-grid dp-days" + (mode === "week" ? " is-week" : "");
        var first = startOfWeek(viewDate);
        var header = el("div", {class:"dp-row dp-weekdays", role:"row"});
        for(var weekday = 0; weekday < 7; weekday++){
          header.appendChild(el("span", {class:"dp-weekday", role:"columnheader"}, [shortWeekday(addDaysTo(first, weekday))]));
        }
        grid.appendChild(header);
        var selectedWeek = mode === "week" && selected ? startOfWeek(selected).getTime() : null;
        for(var week = 0; week < 6; week++){
          var weekStart = addDaysTo(first, week * 7);
          var row = el("div", {class:"dp-row" + (selectedWeek === weekStart.getTime() ? " is-selected-week" : ""), role:"row"});
          for(var offset = 0; offset < 7; offset++){
            var day = addDaysTo(weekStart, offset);
            var isToday = dayStartMs(day) === today.getTime();
            var inRange = !!range && day >= range[0] && day <= range[1];
            var isPicked = mode === "range" ? !!range && (dayStartMs(day) === range[0].getTime() || dayStartMs(day) === range[1].getTime())
              : mode === "week" ? selectedWeek === weekStart.getTime()
              : !!selected && dayStartMs(day) === dayStartMs(selected);
            var button = cellButton(day, String(day.getDate()), longDayLabel(day) + (isToday ? ", hôm nay" : ""),
              "dp-day" + (day.getMonth() !== viewDate.getMonth() ? " is-outside" : "") + (isToday ? " is-today" : "") +
              (isPicked ? " is-selected" : "") + (inRange && mode === "range" ? " is-in-range" : ""), isPicked,
              (function(value){ return function(){ pickDay(value); }; })(day));
            button.addEventListener("mouseenter", (function(value){ return function(){ previewRange(value); }; })(day));
            row.appendChild(button);
          }
          grid.appendChild(row);
        }
      }
      if(mode === "range") hint.textContent = rangeStart ? "Chọn ngày kết thúc" : "Chọn ngày bắt đầu, rồi chọn ngày kết thúc";
      else if(mode === "week") hint.textContent = "Chọn một ngày bất kỳ trong tuần cần xem";
      else hint.textContent = "";
      hint.hidden = !hint.textContent;
      if(focusTarget){
        var target = grid.querySelector('[tabindex="0"]');
        if(target) target.focus({preventScroll:true});
      }
    }

    var timeInput = null;
    var timeError = null;
    function confirmTime(){
      var time = parseTimeText(timeInput.value);
      if(!time){
        timeError.classList.add("show");
        timeInput.focus();
        return;
      }
      var base = selected || focusDate;
      finish(new Date(base.getFullYear(), base.getMonth(), base.getDate(), time.hours, time.minutes));
    }
    if(options.withTime){
      timeInput = el("input", {
        type:"text", class:"dp-time-input", id:"dp-time", inputmode:"numeric", maxlength:"5", autocomplete:"off", placeholder:"HH:mm",
        value:selected ? pad(selected.getHours()) + ":" + pad(selected.getMinutes()) : "09:00"
      });
      timeError = el("div", {class:"field-error"}, ["Nhập giờ dạng HH:mm, ví dụ 14:30."]);
      timeInput.addEventListener("input", function(){
        timeError.classList.remove("show");
        var digits = timeInput.value.replace(/\D/g, "").slice(0, 4);
        if(/^[\d:]*$/.test(timeInput.value) && digits.length >= 3 && timeInput.value.indexOf(":") === -1) timeInput.value = digits.slice(0, 2) + ":" + digits.slice(2);
      });
      timeInput.addEventListener("keydown", function(event){ if(event.key === "Enter"){ event.preventDefault(); confirmTime(); } });
      var chips = el("div", {class:"dp-time-chips"});
      ["08:00", "09:00", "12:00", "14:00", "17:00", "20:00"].forEach(function(value){
        chips.appendChild(el("button", {type:"button", class:"quick-reminder-btn", onclick:function(){ timeInput.value = value; timeError.classList.remove("show"); }}, [value]));
      });
      root.appendChild(el("div", {class:"dp-time"}, [
        el("label", {class:"dp-time-label", for:"dp-time"}, ["Giờ (24 giờ)"]), timeInput, chips, timeError
      ]));
    }
    var todayLabel = {day:"Hôm nay", week:"Tuần này", month:"Tháng này", year:"Năm nay", range:"Hôm nay"}[mode];
    var footer = el("div", {class:"dp-foot"});
    footer.appendChild(el("button", {type:"button", class:"btn btn-outline", onclick:function(){
      if(options.withTime){
        selected = today;
        moveFocus(today);
        return;
      }
      finish(mode === "range" ? [today, today] : today);
    }}, [todayLabel]));
    footer.appendChild(el("div", {class:"spacer"}));
    if(options.clearable) footer.appendChild(el("button", {type:"button", class:"btn btn-outline", onclick:function(){ finish(null); }}, ["Xóa"]));
    if(options.withTime) footer.appendChild(el("button", {type:"button", class:"btn btn-primary", onclick:confirmTime}, ["Xong"]));
    root.appendChild(footer);

    function place(){
      var narrow = window.innerWidth < 600;
      root.classList.toggle("is-sheet", narrow);
      if(narrow){
        root.style.left = "";
        root.style.top = "";
        return;
      }
      var rect = options.anchor.getBoundingClientRect();
      var left = Math.min(Math.max(8, rect.left), window.innerWidth - root.offsetWidth - 8);
      var top = rect.bottom + 6;

  // tự chèn "/" và ":" khi gõ liền số, để gõ tay nhanh mà vẫn đúng dd/mm/yyyy HH:mm
  function attachDateMask(input, withTime){
    input.addEventListener("input", function(event){
      if(event.inputType && event.inputType.indexOf("delete") === 0) return;
      if(input.selectionStart !== input.value.length || !/^[\d\/: ]*$/.test(input.value)) return;
      var digits = input.value.replace(/\D/g, "").slice(0, withTime ? 12 : 8);
      var text = digits.slice(0, 2);
      if(digits.length > 2) text += "/" + digits.slice(2, 4);
      if(digits.length > 4) text += "/" + digits.slice(4, 8);
      if(withTime && digits.length > 8) text += " " + digits.slice(8, 10);
      if(withTime && digits.length > 10) text += ":" + digits.slice(10, 12);
      if(text !== input.value) input.value = text;
    });
  }

        anchor:button, mode:"day", value:value, withTime:!!options.withTime, clearable:!!options.clearable, label:options.buttonLabel,
        onPick:function(result){

        facts.appendChild(el("div", {class:"task-card-fact"}, [
          el("span", {class:"task-card-fact-label"}, [label]),
          el("strong", {class:"task-card-fact-value", title:value}, [value])
        ]));
      }
      addFact("Ngày thực hiện", fmtDate(occurrenceDateOf(task)));
      if(span.start !== null && span.start <= end) addFact("Bắt đầu", fmtDateTime(span.start));
      if(span.end !== null && span.end <= end) addFact("Kết thúc", fmtDateTime(span.end));
      addFact("Vào trạng thái", fmtDateTime(since));
      card.appendChild(facts);
    }
    var spanText = cardFields.span ? (state.workPeriod === "today" ? spanLabelForDay(task, range[0].getTime()) : spanLabelForRange(task, range)) : "";
    if(spanText) card.appendChild(el("div", {class:"task-card-foot"}, [el("span", {class:"span-chip"}, [icon("calendar"), spanText])]));
    return card;
  }
  function buildSnapshotBoard(range){
    var from = range[0].getTime();
    var end = range[1].getTime();
    var visibleColumns = state.settings.columns.filter(function(item){ return item.on; });
    var board = el("div", {class:"board is-review", style:boardColumnsStyle(visibleColumns.length)});
    visibleColumns.forEach(function(item){
      var colDef = item.key === "trash" ? TRASH_STATUS : STATUS_MAP[item.key];
      var entries = state.tasks.map(function(task){
        return {task:task, snapshot:statusAtTime(task, end)};
      }).filter(function(entry){
        if(entry.snapshot.status !== item.key) return false;
        return ACTIVE_STATUSES[item.key] ? true : entry.snapshot.since >= from;
      }).sort(function(a, b){
        return state.settings.sort === "entered" ? b.snapshot.since - a.snapshot.since : compareCards(a.task, b.task);
      });
      var column = el("div", {
        class:item.key === "trash" ? "trash-column" : "column", "data-status-key":item.key,
        style:"--status-color:" + colDef.color + ";--status-ink:" + colDef.ink + ";"
      });
      var count = el("span", {class:"count-badge"}, [String(entries.length)]);
      column.appendChild(el("div", {class:"column-head"}, [el("h3", {}, [colDef.label]), count]));
      var list = el("div", {class:"card-list"});
      var search = el("input", {type:"search", class:"column-search", placeholder:"Tìm công việc...", "aria-label":"Tìm trong trạng thái " + colDef.label});
      search.addEventListener("input", function(){
        var query = search.value.trim().toLowerCase();
        var shown = 0;
        list.querySelectorAll(".task-card").forEach(function(card){
          var hidden = !!query && (card.getAttribute("data-task-title") || "").indexOf(query) === -1;
          card.classList.toggle("search-hidden", hidden);
          if(!hidden) shown++;
        });
        count.textContent = String(shown);
      });
      column.appendChild(search);
      entries.forEach(function(entry){ list.appendChild(buildSnapshotCard(entry.task, item.key, entry.snapshot.since, range)); });
      if(!entries.length && item.key === "trash") list.appendChild(el("div", {class:"trash-empty-hint"}, ["Không có việc nào vào thùng rác trong kỳ này"]));
      column.appendChild(list);
      board.appendChild(column);
    });
    return board;
  }

  function renderWorkView(){
    var range = getRange(state.workPeriod, state.workFrom, state.workTo, state.workAnchorDate);
    var visible = state.tasks.filter(function(t){ return t.status !== "trash"; });
    var activeWorkRange = range;

    var container = el("div");
    container.appendChild(el("div", {class:"view-heading"}, [
      el("div", {}, [el("h2", {}, ["Công việc"]),
        el("p", {}, ["Theo dõi từng bước. Kéo thả hoặc mở thẻ để cập nhật trạng thái."])])
    ]));
    var toolbar = el("div", {class:"toolbar"});
    buildPeriodControls("work").forEach(function(node){ toolbar.appendChild(node); });

    toolbar.appendChild(el("div", {class:"spacer"}));
    toolbar.appendChild(el("button", {class:"btn btn-primary btn-cta", onclick: function(){ openBulkModal(); }}, [icon("plus"), "Thêm nhiều việc"]));
    container.appendChild(toolbar);
    var dayStrip = buildDayStrip(range);
    container.appendChild(dayStrip);
    if(isReviewRange(range)){
      container.appendChild(buildReviewBanner(range));
      container.appendChild(buildSnapshotBoard(range));
      state.workViewApi = {setPeriod:render, refreshDate:render, refreshRange:render};
      app.appendChild(container);
      return;
    }
    function refreshDayStrip(){
      var next = buildDayStrip(activeWorkRange);
      dayStrip.replaceWith(next);
      dayStrip = next;
    }

    var board = el("div", {class:"board"});
    function refreshColumnCounts(){
      board.querySelectorAll(".column,.trash-column").forEach(function(column){
        var count = column.querySelectorAll(":scope > .card-list > .task-card:not(.search-hidden)").length;
        var badge = column.querySelector(".count-badge");
        if(badge) badge.textContent = String(count);
      });
    }
    function sortCardList(listEl){
      var cards = Array.prototype.slice.call(listEl.querySelectorAll(":scope > .task-card"));
      cards.map(function(card){
        return {card:card, task:getTaskById(card.getAttribute("data-task-id"))};
      }).sort(function(a, b){ return a.task && b.task ? compareCards(a.task, b.task) : 0; })
        .forEach(function(item){ listEl.appendChild(item.card); });
    }
    function applyColumnSearch(column, query){
      var normalized = (query || "").trim().toLowerCase();
      var filterByPeriod = column.dataset.statusKey === "done";
      column.querySelectorAll(".task-card").forEach(function(card){
        var title = card.getAttribute("data-task-title") || "";
        var task = getTaskById(card.getAttribute("data-task-id"));
        var outsideRange = filterByPeriod && task && !taskCompletedInRange(task, activeWorkRange);
        card.classList.toggle("search-hidden", outsideRange || (!!normalized && title.indexOf(normalized) === -1));
      });
      refreshColumnCounts();
    }
    function renderWorkCardContents(card, task, colDef, isTrash){
      card.replaceChildren();
      var liveTiming = !isTrash && (task.status === "inprogress" || task.status === "pending");
      card._liveTimingTask = liveTiming ? task : null;
      card.setAttribute("data-live-timing", liveTiming ? "true" : "false");
      card.setAttribute("data-task-title", task.title.toLowerCase());
      card.setAttribute("aria-label", "Mở công việc " + task.title + (isTrash ? " trong thùng rác" : " ngày " + fmtDate(occurrenceDateOf(task))));
      card.appendChild(el("div", {class:"t-title", title:task.title}, [task.title]));
      var cardFields = state.settings.card;
      var description = (task.description || "").trim();
      if(cardFields.description) card.appendChild(el("p", {class:"t-description"+(description ? "" : " is-empty"), title:description || "Chưa có mô tả"}, [description || "Chưa có mô tả"]));
      if(!isTrash && cardFields.progress) card.appendChild(progressBar(PROGRESS_MAP[task.status] || 0, task.status));
      var timing = taskTimingSummary(task);
      var facts = el("div", {class:"task-card-facts"});
      function addFact(label, value, liveKind){
        var valueAttrs = {class:"task-card-fact-value", title:value};
        if(liveKind) valueAttrs["data-live-kind"] = liveKind;
        facts.appendChild(el("div", {class:"task-card-fact"}, [
          el("span", {class:"task-card-fact-label"}, [label]),
          el("strong", valueAttrs, [value])
        ]));
      }
      addFact("Ngày thực hiện", fmtDate(occurrenceDateOf(task)));
      if(task.status === "inprogress"){
        if(timing.currentInprogressMs !== null) addFact("Đang thực hiện", liveDurationText(timing.currentInprogressMs), "currentInprogress");
      } else if(task.status === "pending"){
        if(timing.currentPendingMs !== null) addFact("Đang chờ phê duyệt", liveDurationText(timing.currentPendingMs), "currentPending");
      } else {
        if(timing.startAt) addFact("Bắt đầu", fmtDateTime(timing.startAt));
        if(timing.endAt) addFact("Kết thúc", fmtDateTime(timing.endAt));
      }
      if(timing.inprogressMs !== null && task.status !== "pending") addFact("Tổng thực hiện", task.status === "inprogress" ? liveDurationText(timing.inprogressMs) : durationText(timing.inprogressMs), task.status === "inprogress" ? "totalInprogress" : null);
      if(timing.pendingMs !== null && task.status !== "inprogress") addFact("Tổng chờ phê duyệt", task.status === "pending" ? liveDurationText(timing.pendingMs) : durationText(timing.pendingMs), task.status === "pending" ? "totalPending" : null);
      if(isTrash && timing.deletedAt) addFact("Chuyển vào rác", fmtDateTime(timing.deletedAt));
      if(cardFields.facts) card.appendChild(facts);
      var spanText = !isTrash && cardFields.span ? workRangeSpanLabel(task) : "";
      var showReminder = !!task.reminderAt && !isTrash && cardFields.reminder;
      if(spanText || showReminder){
        var foot = el("div", {class:"task-card-foot"});
        if(spanText) foot.appendChild(el("span", {class:"span-chip", title:"Số ngày đã làm việc này"}, [icon("calendar"), spanText]));
        if(showReminder){
          var reminderPast = new Date(task.reminderAt).getTime() <= Date.now();
          foot.appendChild(el("span", {class:"task-reminder"+(reminderPast ? " is-overdue" : "")}, ["Nhắc · "+fmtDateTime(task.reminderAt)]));
        }
        card.appendChild(foot);
      }
    }
    function workRangeSpanLabel(task){
      if(!activeWorkRange[0]) return "";
      return state.workPeriod === "today" ? spanLabelForDay(task, activeWorkRange[0].getTime()) : spanLabelForRange(task, activeWorkRange);
    }
    var workColumns = {};
    function beginInlineCardEdit(card, field){
      var task = getTaskById(card.getAttribute("data-task-id"));
      if(!task || card.dataset.inlineEditing === "true") return;
      var target = card.querySelector(field === "title" ? ".t-title" : ".t-description");
      if(!target) return;
      card.dataset.inlineEditing = "true";
      card.draggable = false;
      var editor = el("div", {class:"task-card-inline-editor"});
      var input = el(field === "title" ? "input" : "textarea", field === "title"
        ? {type:"text", value:task.title, "aria-label":"Sửa tên công việc"}
        : {"aria-label":"Sửa mô tả công việc", placeholder:"Nhập mô tả công việc..."});
      if(field !== "title") input.value = task.description || "";
      var error = el("div", {class:"field-error"}, ["Tên công việc không được để trống."]);
      var actions = el("div", {class:"task-card-inline-editor-actions"});
      var saveButton = el("button", {type:"button", class:"inline-save", "aria-label":"Lưu sửa nhanh"}, ["Lưu"]);
      var cancelButton = el("button", {type:"button", "aria-label":"Hủy sửa nhanh"}, ["Hủy"]);
      function finish(updatedTask){
        card.draggable = true;
        delete card.dataset.inlineEditing;
        card.setAttribute("data-task-id", updatedTask.id);
        renderWorkCardContents(card, updatedTask, STATUS_MAP[updatedTask.status], updatedTask.status === "trash");
        var column = card.closest(".column,.trash-column");
        if(column && !column.classList.contains("trash-column")){
          applyColumnSearch(column, state.workSearchByStatus[updatedTask.status]);
        }
      }
      function save(){
        var value = input.value.trim();
        if(field === "title" && !value){ error.classList.add("show"); input.focus(); return; }
        updateTaskFields(task.id, field === "title" ? value : task.title,
          field === "description" ? value : (task.description || ""), task.reminderAt || null);
        finish(getTaskById(task.id) || task);
      }
      editor.addEventListener("click", function(event){ event.stopPropagation(); });
      editor.addEventListener("dblclick", function(event){ event.stopPropagation(); });
      input.addEventListener("input", function(){ error.classList.remove("show"); });
      input.addEventListener("keydown", function(event){
        event.stopPropagation();
        if(event.key === "Escape"){ event.preventDefault(); finish(task); }
        if(event.key === "Enter" && (field === "title" || event.ctrlKey || event.metaKey)){
          event.preventDefault(); save();
        }
      });
      saveButton.addEventListener("click", save);
      cancelButton.addEventListener("click", function(){ finish(task); });
      actions.appendChild(saveButton);
      actions.appendChild(cancelButton);
      editor.appendChild(input);
      editor.appendChild(error);
      editor.appendChild(actions);
      target.replaceWith(editor);
      input.focus();
      if(field === "title") input.select();
    }
    function buildWorkTaskCard(t, colDef){
      var card = el("div", {
        class:"task-card", draggable:"true", "data-task-id":t.id,
        "data-task-title":t.title.toLowerCase(),
        role:"button", tabindex:"0", "aria-label":"Mở công việc " + t.title + " ngày " + fmtDate(occurrenceDateOf(t))
      });
      var openTimer = null;
      card.addEventListener("dragstart", function(e){
        clearTimeout(openTimer);
        e.dataTransfer.setData("text/plain", card.getAttribute("data-task-id"));
        setTimeout(function(){ card.classList.add("dragging"); }, 0);
      });
      card.addEventListener("dragend", function(){ card.classList.remove("dragging"); });
      card.addEventListener("click", function(event){
        if(card.dataset.inlineEditing === "true") return;
        if(event.detail > 1){ clearTimeout(openTimer); return; }
        var editable = event.target.closest(".t-title,.t-description");
        if(!editable || event.detail === 0){ openTaskDetail(card.getAttribute("data-task-id")); return; }
        clearTimeout(openTimer);
        openTimer = setTimeout(function(){ openTaskDetail(card.getAttribute("data-task-id")); }, 320);
      });
      card.addEventListener("dblclick", function(event){
        var editable = event.target.closest(".t-title,.t-description");
        if(!editable) return;
        event.preventDefault();
        clearTimeout(openTimer);
        beginInlineCardEdit(card, editable.classList.contains("t-title") ? "title" : "description");
      });
      card.addEventListener("keydown", function(e){
        if(card.dataset.inlineEditing === "true" || e.target.closest("input,textarea,button")) return;
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openTaskDetail(card.getAttribute("data-task-id")); }
      });
      renderWorkCardContents(card, t, colDef, false);
      return card;
    }
    function syncWorkBoardTasks(){
      var displayTasks = state.tasks.filter(function(t){ return t.status !== "trash"; });
      Object.keys(workColumns).forEach(function(statusKey){
        var columnInfo = workColumns[statusKey];
        var list = columnInfo.list;
        var desiredTasks = displayTasks.filter(function(t){ return t.status === statusKey; });
        var desiredIds = {};
        desiredTasks.forEach(function(t){ desiredIds[t.id] = true; });
        var existingIds = {};
        list.querySelectorAll(".task-card").forEach(function(card){ existingIds[card.getAttribute("data-task-id")] = true; });
        desiredTasks.forEach(function(t){
          if(!existingIds[t.id]) list.appendChild(buildWorkTaskCard(t, columnInfo.colDef));
        });
        sortCardList(list);
        applyColumnSearch(columnInfo.column, state.workSearchByStatus[statusKey]);
      });
    }
    function buildStatusColumn(colDef, colIdx){
      var colTasks = visible.filter(function(t){ return t.status === colDef.key; }).sort(compareCards);
      var column = el("div", {class:"column fade-in", "data-status-key":colDef.key, style:
        "--status-color:"+colDef.color+";--status-ink:"+colDef.ink+";animation-delay:"+(colIdx*0.06)+"s;"
      });
      var head = el("div", {class:"column-head"});
      head.appendChild(el("h3", {}, [colDef.label]));
      head.appendChild(el("span", {class:"count-badge"}, [String(colTasks.length)]));
      var columnSearch = el("input", {
        type:"search",
        value:(state.workSearchByStatus && state.workSearchByStatus[colDef.key]) || "",
        placeholder:"Tìm công việc...",
        "aria-label":"Tìm trong trạng thái " + colDef.label,
        class:"column-search",
        style:"--search-color:"+colDef.color+";"
      });
      columnSearch.addEventListener("input", function(){
        state.workSearchByStatus[colDef.key] = columnSearch.value;
        applyColumnSearch(column, columnSearch.value);
      });
      column.appendChild(head);
      column.appendChild(columnSearch);

      if(colDef.key === "todo"){
        var quick = el("div", {class:"quick-add"});
        var input = el("input", {type:"text", placeholder:"+ Thêm việc, Enter để lưu", "aria-label":"Thêm nhanh công việc mới, nhấn Enter để lưu"});
        input.addEventListener("keydown", function(e){
          if(e.key === "Enter"){
            addTask(input.value, colDef.key);
            input.value = "";
            render();
            setTimeout(function(){
              var el2 = document.querySelector(".quick-add input");
              if(el2) el2.focus();
            }, 0);
          }
        });
        quick.appendChild(input);
        column.appendChild(quick);
      }

      var list = el("div", {class:"card-list"});
      list.addEventListener("dragover", function(e){ e.preventDefault(); list.classList.add("drag-over"); });
      list.addEventListener("dragleave", function(){ list.classList.remove("drag-over"); });
      list.addEventListener("drop", function(e){
        e.preventDefault();
        list.classList.remove("drag-over");
        var id = e.dataTransfer.getData("text/plain");
        var movingTask = getTaskById(id);
        if(!movingTask) return;
        var card = board.querySelector('[data-task-id="' + id + '"]');
        if(!canChangeStatus(movingTask.status, colDef.key)){
          var suggestedStatusKey = getSuggestedStatusKey(movingTask.status);
          var warningMessage = [
            "Không thể chuyển công việc từ ", statusBadge(movingTask.status),
            " sang ", statusBadge(colDef.key), ". "
          ];
          if(suggestedStatusKey){
            warningMessage.push("Vui lòng chuyển sang ", statusBadge(suggestedStatusKey), " trước.");
          } else {
            warningMessage.push("Vui lòng chọn trạng thái phù hợp trước.");
          }
          showConfirm(warningMessage, {title:"Không thể chuyển trạng thái", hideCancel:true, okLabel:"Đã hiểu"});
          return;
        }
        if(!setStatus(id, colDef.key)) return;
        if(card){
          var storedTask = movingTask;
          list.appendChild(card);
          renderWorkCardContents(card, storedTask, colDef, false);
          sortCardList(list);
          applyColumnSearch(column, state.workSearchByStatus[colDef.key]);
          var trashCardList = board.querySelector(".trash-column > .card-list");
          if(trashCardList && !trashCardList.querySelector(".task-card") && !trashCardList.querySelector(".trash-empty-hint")){
            trashCardList.appendChild(el("div", {class:"trash-empty-hint"}, ["Kéo công việc vào đây để xóa"]));
          }
          refreshColumnCounts();
        }
      });

      colTasks.forEach(function(t){
        list.appendChild(buildWorkTaskCard(t, colDef));
      });

      column.appendChild(list);
      workColumns[colDef.key] = {column:column, list:list, colDef:colDef};
      applyColumnSearch(column, state.workSearchByStatus[colDef.key]);
      return column;
    }

    // trash column — drag a card here to delete it
    function buildTrashColumn(colIdx){
      var trashTasks = state.tasks.filter(function(t){ return t.status === "trash"; }).sort(compareCards);
      var trashColumn = el("div", {class:"trash-column fade-in", "data-status-key":"trash", style:"--status-color:"+TRASH_STATUS.color+";--status-ink:"+TRASH_STATUS.ink+";animation-delay:"+(colIdx*0.06)+"s;"});
      var trashHead = el("div", {class:"column-head"});
      trashHead.appendChild(el("h3", {}, [TRASH_STATUS.label]));
      trashHead.appendChild(el("span", {class:"count-badge"}, [String(trashTasks.length)]));
      trashColumn.appendChild(trashHead);

      var trashList = el("div", {class:"card-list"});
      trashList.addEventListener("dragover", function(e){ e.preventDefault(); trashList.classList.add("drag-over"); });
      trashList.addEventListener("dragleave", function(){ trashList.classList.remove("drag-over"); });
      trashList.addEventListener("drop", function(e){
        e.preventDefault();
        trashList.classList.remove("drag-over");
        var id = e.dataTransfer.getData("text/plain");
        var movingTask = getTaskById(id);
        if(!movingTask) return;
        var card = board.querySelector('[data-task-id="' + id + '"]');
        if(!setTaskToTrash(id)) return;
        if(card){
          var storedTask = movingTask;
          var emptyHint = trashList.querySelector(".trash-empty-hint");
          if(emptyHint) emptyHint.remove();
          trashList.appendChild(card);
          renderWorkCardContents(card, storedTask, TRASH_STATUS, true);
          sortCardList(trashList);
          applyColumnSearch(trashColumn, state.workSearchByStatus.trash);
          var clearTrashButton = trashColumn.querySelector(".trash-clear button");
          if(clearTrashButton) clearTrashButton.removeAttribute("disabled");
          refreshColumnCounts();
        }
      });

      if(!trashTasks.length){
        trashList.appendChild(el("div", {class:"trash-empty-hint"}, ["Kéo công việc vào đây để xóa"]));
      } else {
        trashTasks.forEach(function(t){
          var card = el("div", {
            class:"task-card", draggable:"true", "data-task-id":t.id,
            "data-task-title":t.title.toLowerCase(), role:"button", tabindex:"0",
            "aria-label":"Mở công việc " + t.title + " trong thùng rác"
          });
          card.addEventListener("dragstart", function(e){
            e.dataTransfer.setData("text/plain", t.id);
            setTimeout(function(){ card.classList.add("dragging"); }, 0);
          });
          card.addEventListener("dragend", function(){ card.classList.remove("dragging"); });
          card.addEventListener("click", function(){ openTaskDetail(t.id); });
          card.addEventListener("keydown", function(e){
            if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openTaskDetail(t.id); }
          });
          renderWorkCardContents(card, t, TRASH_STATUS, true);
          trashList.appendChild(card);
        });
      }
      trashColumn.appendChild(trashList);
      var trashSearch = el("input", {
        type:"search",
        value:(state.workSearchByStatus && state.workSearchByStatus.trash) || "",
        placeholder:"Tìm công việc...",
        "aria-label":"Tìm trong thùng rác",
        class:"column-search",
        style:"--search-color:"+TRASH_STATUS.color+";"
      });
      trashSearch.addEventListener("input", function(){
        state.workSearchByStatus.trash = trashSearch.value;
        applyColumnSearch(trashColumn, trashSearch.value);
      });
      trashColumn.insertBefore(trashSearch, trashList);

      var trashClear = el("div", {class:"trash-clear"});
      var clearBtnAttrs = {
        class:"btn btn-outline",
        onclick: function(){
          var currentTrashTasks = state.tasks.filter(function(task){ return task.status === "trash"; });
          if(!currentTrashTasks.length) return;
          showConfirm("Xóa vĩnh viễn " + currentTrashTasks.length + " công việc trong thùng rác? Hành động này không thể hoàn tác.", {
            title: "Dọn thùng rác",
            tone: "danger",
            okLabel: "Xóa vĩnh viễn",
            onOk: function(){
              emptyTrash();
              render();
            }
          });
        }
      };
      if(!trashTasks.length) clearBtnAttrs.disabled = "disabled";
      trashClear.appendChild(el("button", clearBtnAttrs, ["Dọn thùng rác"]));
      trashColumn.appendChild(trashClear);

      applyColumnSearch(trashColumn, state.workSearchByStatus.trash);
      return trashColumn;
    }

    var visibleColumns = state.settings.columns.filter(function(item){ return item.on; });
    board.setAttribute("style", boardColumnsStyle(visibleColumns.length));
    visibleColumns.forEach(function(item, index){
      board.appendChild(item.key === "trash" ? buildTrashColumn(index) : buildStatusColumn(STATUS_MAP[item.key], index));
    });
    refreshColumnCounts();

    container.appendChild(board);
    function refreshWorkRange(){
      activeWorkRange = getRange(state.workPeriod, state.workFrom, state.workTo, state.workAnchorDate);
      if(isReviewRange(activeWorkRange)){ render(); return; }
      refreshDayStrip();
      syncPeriodControls("work", toolbar);
      syncWorkBoardTasks();
      board.querySelectorAll(".column,.trash-column").forEach(function(column){
        var key = column.querySelector(".column-search");
        applyColumnSearch(column, key ? key.value : "");
      });
    }
    state.workViewApi = {setPeriod:refreshWorkRange, refreshDate:refreshWorkRange, refreshRange:refreshWorkRange};
    app.appendChild(container);
  }

  function taskRowAttrs(taskId){
    return {
      role:"button", tabindex:"0",
      onclick:function(){ openTaskDetail(taskId); },

  function renderReportView(existingContainer){
    var isRefresh = !!existingContainer;
    var container = existingContainer || el("div", {class:"report-view"});
    if(!existingContainer){
      container.appendChild(el("div", {class:"view-heading"}, [
        el("div", {}, [el("h2", {}, ["Tổng quan"]),

        el("button", {type:"button", class:"btn btn-outline", onclick:function(){ state.view = "settings"; render(); }}, [icon("sliders"), "Tùy chỉnh bố cục"])
      ]));
    }
    var toolbar = container.querySelector(".toolbar");
    if(!toolbar){
      toolbar = el("div", {class:"toolbar"});
      buildPeriodControls("report").forEach(function(node){ toolbar.appendChild(node); });
      container.appendChild(toolbar);
    } else {
      syncPeriodControls("report", toolbar);
    }
    var oldContent = container.querySelector(".report-content");
    if(oldContent) oldContent.remove();
    var reportContent = el("div", {class:"report-content"});

    var range = getRange(state.reportPeriod, state.reportFrom, state.reportTo, state.reportAnchorDate);
    var previousRange = getPreviousRange(state.reportPeriod, range);

    // Chỉ cộng các khoảng ở trạng thái Đang thực hiện; không cộng thời gian chờ phê duyệt.
    var durationRows = [];
    state.tasks.forEach(function(t){
      if(t.status !== "done") return; // chỉ tính việc ĐANG ở trạng thái Hoàn thành, không tính việc đã kéo ra khỏi đó
      var firstInProgressAt = null;
      var doneAt = null;
      t.history.forEach(function(h){
        if(h.to === "inprogress" && !firstInProgressAt) firstInProgressAt = h.at;
        if(h.to === "done") doneAt = h.at;
      });
      if(doneAt && inRange(doneAt, range)){
        var timing = taskTimingSummary(t);
        durationRows.push({
          taskId: t.id,
          task: t,
          title: t.title,
          start: firstInProgressAt,
          end: doneAt,
          durationMs: timing.inprogressMs
        });
      }
    });
    durationRows.sort(function(a,b){ return new Date(b.end) - new Date(a.end); });

    // công việc thuộc kỳ hiện tại và kỳ trước để so sánh trong summary
    var currentSummaryTasks = state.tasks.filter(function(t){
      return t.status !== "trash" && taskRelevantToRange(t, range);
    });
    var previousSummaryTasks = previousRange[0] ? state.tasks.filter(function(t){
      return t.status !== "trash" && taskRelevantToRange(t, previousRange);
    }) : [];

    // công việc cần làm TRONG KỲ đang chọn (chưa xong, liên quan tới khoảng thời gian đã lọc)
    var todoInRange = state.tasks.filter(function(t){
      if(["todo","inprogress","pending"].indexOf(t.status) === -1) return false;
      return taskRelevantToRange(t, range);
    }).sort(function(a,b){ return new Date(b.createdAt) - new Date(a.createdAt); });

    var reminderRows = state.tasks.filter(function(t){
      return t.status !== "trash" && t.reminderAt && inRange(t.reminderAt, range);
    }).sort(function(a,b){ return new Date(a.reminderAt) - new Date(b.reminderAt); });

    var doneCount = currentSummaryTasks.filter(function(t){ return t.status === "done"; }).length;
    var completionRate = currentSummaryTasks.length
      ? Math.round(doneCount / currentSummaryTasks.length * 100) : 0;
    var insight = el("div", {class:"report-insight"});
    insight.appendChild(el("div", {class:"insight-copy"}, [
      el("span", {class:"insight-eyebrow"}, ["TIẾN ĐỘ KỲ NÀY"]),
      el("div", {class:"insight-title"}, [
        currentSummaryTasks.length ? completionRate + "% đã hoàn thành" : "Sẵn sàng bắt đầu"
      ]),
      el("p", {}, [currentSummaryTasks.length
        ? doneCount + "/" + currentSummaryTasks.length + " công việc hoàn thành · " + reminderRows.length + " lịch nhắc"
        : "Chưa có công việc trong kỳ. Hãy chọn kỳ khác hoặc thêm công việc mới."])
    ]));
    var insightActions = el("div", {class:"insight-actions"});
    insightActions.appendChild(el("div", {class:"insight-progress", role:"progressbar",
      "aria-label":"Tỷ lệ hoàn thành công việc", "aria-valuenow":String(completionRate),
      "aria-valuemin":"0", "aria-valuemax":"100"}, [
      el("span", {style:"width:"+completionRate+"%;"})
    ]));
    insightActions.appendChild(el("button", {class:"insight-link", type:"button", onclick:function(){
      state.view = "work";
      render();
    }}, ["Mở bảng công việc", icon("arrowRight")]));
    insight.appendChild(insightActions);
    var sections = {insight:insight};

    // các thẻ tóm tắt theo trạng thái
    var summaryRow = el("div", {class:"report-summary"});
    [
      {label:"Tổng số công việc", color:"var(--primary)"},
      {label:"Đang thực hiện", status:"inprogress", color:STATUS_MAP.inprogress.color},
      {label:"Chờ phê duyệt", status:"pending", color:STATUS_MAP.pending.color},
      {label:"Hoàn thành", status:"done", color:STATUS_MAP.done.color},
      {label:"Chờ duyệt quá 12 giờ", status:"pending", overdue:true, color:"var(--warning)"}
    ].forEach(function(item, index){
      var candidates = item.status
        ? currentSummaryTasks.filter(function(t){ return t.status === item.status; })
        : currentSummaryTasks;
      var tasks = item.overdue ? pendingOver12Hours(candidates, Date.now()) : candidates;
      var previousTasks = item.status
        ? previousSummaryTasks.filter(function(t){ return t.status === item.status; })
        : previousSummaryTasks;
      var comparison = item.overdue
        ? {text:"Đang chờ trên 12 giờ", color:"var(--warning)"}
        : summaryComparison(tasks.length, previousTasks.length, !!previousRange[0]);
      var summaryCard = el("button", {
        type:"button", class:"stat-card clickable fade-in", style:"--stat-color:"+item.color+";",
        onclick:function(){ renderTaskListModal(item.label, item.overdue ? pendingOver12Hours(candidates, Date.now()) : tasks); }
      }, [
        el("div", {class:"stat-card-head"}, [
          el("span", {class:"lbl"}, [item.label]),
          el("span", {class:"stat-card-arrow", "aria-hidden":"true"}, [icon("arrowUpRight")])
        ]),
        el("div", {class:"num"}, [String(tasks.length)]),
        el("div", {class:"compare", style:"color:"+comparison.color+";"}, [comparison.text])
      ]);
      if(item.overdue){
        summaryCard.setAttribute("data-overdue-card", "true");
        summaryCard._pendingCandidates = candidates;
      }
      summaryRow.appendChild(summaryCard);
    });
    sections.summary = summaryRow;

    var topRow = el("div", {class:"report-top-grid"});

    // tỷ lệ công việc theo trạng thái: 1/4 chiều rộng
    var panelChart = el("div", {class:"panel fade-in", style:"animation-delay:.06s;padding:20px;"});
    panelChart.appendChild(el("h3", {style:"font-size:13px;"}, ["Tỷ lệ công việc theo trạng thái"]));
    panelChart.appendChild(buildStatusDonut(currentSummaryTasks));
    topRow.appendChild(panelChart);

    // danh sách công việc đã hoàn thành: thay cho danh sách công việc cần làm trong kỳ
    var panelCompleted = el("div", {class:"panel report-todo-panel fade-in", style:"animation-delay:.12s;"});
    panelCompleted.appendChild(el("h3", {}, ["Công việc đã hoàn thành"]));
    if(!durationRows.length){
      panelCompleted.appendChild(el("div", {class:"empty-hint"}, ["Chưa có công việc nào hoàn thành trong khoảng thời gian này."]));
    } else {
      panelCompleted.appendChild(el("span", {class:"table-scroll-hint"}, ["Kéo ngang để xem thời gian →"]));
      var completedWrap = el("div", {class:"clickable-table report-todo-list drag-scroll"});
      var completedTable = el("table");
      completedTable.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", {}, ["Tên việc"]),
        el("th", {}, ["Bắt đầu"]),
        el("th", {}, ["Hoàn thành"]),
        el("th", {}, ["Tổng thực hiện"]),
        el("th", {}, ["Chờ duyệt"])
      ])]));
      var completedBody = el("tbody");
      durationRows.forEach(function(r){
        completedBody.appendChild(el("tr", taskRowAttrs(r.taskId), [
          el("td", {style:"font-weight:600;color:var(--text);"}, [r.title]),
          el("td", {style:"white-space:nowrap;color:var(--text-dim);"}, [r.start ? fmtDateTime(r.start) : "—"]),
          el("td", {style:"white-space:nowrap;color:var(--text-dim);"}, [fmtDateTime(r.end)]),
          el("td", {style:"white-space:nowrap;color:var(--text-dim);"}, [r.durationMs !== null ? durationText(r.durationMs) : "—"]),
          el("td", {class:"approval-table-cell"}, [approvalTimingView(r.task)])
        ]));
      });
      completedTable.appendChild(completedBody);
      completedWrap.appendChild(completedTable);
      panelCompleted.appendChild(completedWrap);
    }
    topRow.appendChild(panelCompleted);

    sections.charts = topRow;

    // công việc cần làm và danh sách nhắc lịch phía dưới, mỗi panel 50%
    var bottomRow = el("div", {class:"report-bottom-grid"});
    var todoPanel = el("div", {class:"panel report-bottom-panel report-todo-panel fade-in", style:"animation-delay:.34s;"});
    todoPanel.appendChild(el("h3", {}, ["Công việc cần làm"]));
    if(!todoInRange.length){
      todoPanel.appendChild(el("div", {class:"empty-hint"}, ["Không có việc nào cần làm trong khoảng thời gian này."]));
    } else {
      todoPanel.appendChild(el("span", {class:"table-scroll-hint"}, ["Kéo ngang để xem thời gian phê duyệt →"]));
      var todoWrap = el("div", {class:"report-table-scroll clickable-table drag-scroll"});
      var todoTable = el("table");
      todoTable.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", {}, ["Tên công việc"]),
        el("th", {}, ["Trạng thái"]),
        el("th", {}, ["Ngày thực hiện"]),
        el("th", {}, ["Chờ duyệt"])
      ])]));
      var todoBody = el("tbody");
      todoInRange.forEach(function(t){
        todoBody.appendChild(el("tr", taskRowAttrs(t.id), [
          el("td", {style:"font-weight:600;color:var(--text);"}, [t.title]),
          el("td", {}, [statusBadge(t.status)]),
          el("td", {style:"white-space:nowrap;color:var(--text-dim);"}, [fmtDate(occurrenceDateOf(t))]),
          el("td", {class:"approval-table-cell"}, [approvalTimingView(t)])
        ]));
      });
      todoTable.appendChild(todoBody);
      todoWrap.appendChild(todoTable);
      todoPanel.appendChild(todoWrap);
    }
    bottomRow.appendChild(todoPanel);

    var reminderPanel = el("div", {class:"panel report-bottom-panel fade-in", style:"animation-delay:.38s;"});
    reminderPanel.appendChild(el("h3", {}, ["Danh sách nhắc lịch"]));
    if(!reminderRows.length){
      reminderPanel.appendChild(el("div", {class:"empty-hint"}, ["Không có lịch nhắc nào trong khoảng thời gian này."]));
    } else {
      reminderPanel.appendChild(el("span", {class:"table-scroll-hint"}, ["Kéo ngang để xem thời gian phê duyệt →"]));
      var reminderWrap = el("div", {class:"report-table-scroll clickable-table drag-scroll"});
      var reminderTable = el("table");
      reminderTable.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", {}, ["Tên công việc"]),
        el("th", {}, ["Trạng thái"]),
        el("th", {}, ["Nhắc lúc"]),
        el("th", {}, ["Chờ duyệt"])
      ])]));
      var reminderBody = el("tbody");
      reminderRows.forEach(function(t){
        var row = el("tr", taskRowAttrs(t.id));
        row.appendChild(el("td", {style:"font-weight:600;color:var(--text);"}, [t.title]));
        row.appendChild(el("td", {}, [statusBadge(t.status)]));
        row.appendChild(el("td", {style:"white-space:nowrap;color:var(--text-dim);"}, [fmtDateTime(t.reminderAt)]));
        row.appendChild(el("td", {class:"approval-table-cell"}, [approvalTimingView(t)]));
        reminderBody.appendChild(row);
      });
      reminderTable.appendChild(reminderBody);
      reminderWrap.appendChild(reminderTable);
      reminderPanel.appendChild(reminderWrap);
    }
    bottomRow.appendChild(reminderPanel);
    sections.lists = bottomRow;
    state.settings.reportSections.forEach(function(item){
      if(item.on) reportContent.appendChild(sections[item.key]);
    });

    container.appendChild(reportContent);
    if(!isRefresh) app.appendChild(container);
    refreshScrollHints();
    state.reportViewApi = {
      refresh:function(){
        var currentView = app.querySelector(".report-view");
        if(currentView) renderReportView(currentView);
        else render();
      }
    };
  }

  // ---------- lịch: dòng thời gian hai tuần + nhật ký của ngày được chọn ----------
  var EVENT_TEXT = {todo:"Chuyển về Mới", inprogress:"Bắt đầu thực hiện", pending:"Gửi chờ phê duyệt", done:"Hoàn thành", closed:"Đóng công việc", trash:"Chuyển vào thùng rác"};
  function historyEventText(entry, previous){
    if(entry.from === null || !previous) return "Tạo công việc";
    if(entry.to === "inprogress" && previous.to === "pending") return "Tiếp tục thực hiện";
    if(previous.to === "trash") return "Khôi phục từ thùng rác";
    return EVENT_TEXT[entry.to] || "Đổi trạng thái";
  }
  function statusDef(key){ return key === "trash" ? TRASH_STATUS : (STATUS_MAP[key] || STATUS_MAP.todo); }
  function calendarSelectedDay(){
    return state.calendarDay ? dayStartMs(new Date(state.calendarDay + "T12:00:00")) : dayStartMs(new Date());
  }
  function selectCalendarDay(dayMs){
    state.calendarDay = toolbarDateValue(new Date(dayMs));
    render();
  }
  function agendaItem(task, statusKey, subText, metaText){
    var colDef = statusDef(statusKey);
    var children = [
      el("span", {class:"agenda-dot", "aria-hidden":"true"}),
      el("span", {class:"agenda-item-copy"}, [
        el("span", {class:"agenda-item-title"}, [task.title]),
        el("span", {class:"agenda-item-sub"}, [subText])
      ])
    ];
    if(metaText) children.push(el("span", {class:metaText.chip ? "span-chip" : "agenda-item-meta"}, [metaText.text]));
    return el("button", {type:"button", class:"agenda-item", style:"--row-fill:" + colDef.color + ";--row-ink:" + colDef.ink + ";",
      onclick:function(){ openTaskDetail(task.id); }}, children);
  }
  function agendaSection(title, items, emptyText){
    var section = el("section", {class:"agenda-section"}, [el("h4", {}, [title])]);
    if(!items.length) section.appendChild(el("p", {class:"agenda-empty"}, [emptyText]));
    items.forEach(function(item){ section.appendChild(item); });
    return section;
  }
  function renderCalendarView(){
    var selected = calendarSelectedDay();
    var now = Date.now();
    var today = dayStartMs(new Date());
    var windowStart = startOfWeek(new Date(selected));
    windowStart.setDate(windowStart.getDate() - 7);
    var startMs = windowStart.getTime();
    var days = [];
    for(var offset = 0; offset < 14; offset++){
      var day = new Date(windowStart);
      day.setDate(windowStart.getDate() + offset);
      days.push(day.getTime());
    }

    var container = el("div", {class:"calendar-view"});
    container.appendChild(el("div", {class:"view-heading"}, [
      el("div", {}, [el("h2", {}, ["Lịch"]),
        el("p", {}, ["Mỗi thanh là quãng thời gian một việc được làm. Chọn một ngày để đọc nhật ký của ngày đó."])])
    ]));
    var calendarLabel = el("button", {
      type:"button", class:"period-label", "aria-haspopup":"dialog", "aria-label":"Đang xem " + longDayLabel(selected) + ". Bấm để chọn ngày khác",
      onclick:function(){ openDatePicker({anchor:calendarLabel, mode:"day", label:"Chọn ngày", value:new Date(selected), onPick:function(day){ selectCalendarDay(day.getTime()); }}); }
    }, [icon("calendar"), el("span", {class:"period-label-text period-label-long"}, [fmtDate(days[0]) + " – " + fmtDate(days[13])]),
      el("span", {class:"period-label-text period-label-short", "aria-hidden":"true"}, [fmtDate(days[0]).slice(0, 5) + " – " + fmtDate(days[13]).slice(0, 5)]), icon("chevronDown")]);
    var toolbar = el("div", {class:"toolbar"}, [
      el("button", {class:"period-arrow", type:"button", title:"Lùi một tuần", "aria-label":"Lùi một tuần", onclick:function(){ selectCalendarDay(selected - 7 * DAY_MS + DAY_MS / 2); }}, [icon("chevronLeft")]),
      calendarLabel,
      el("button", {class:"period-arrow", type:"button", title:"Tới một tuần", "aria-label":"Tới một tuần", onclick:function(){ selectCalendarDay(selected + 7 * DAY_MS + DAY_MS / 2); }}, [icon("chevronRight")]),
      el("div", {class:"spacer"}),
      el("button", {class:"btn btn-outline", type:"button", onclick:function(){ selectCalendarDay(today); }}, ["Hôm nay"])
    ]);
    container.appendChild(toolbar);

    var layout = el("div", {class:"calendar-layout"});
    var ganttPanel = el("section", {class:"panel gantt-panel", "aria-label":"Dòng thời gian hai tuần"});
    var ganttHead = el("div", {class:"gantt-head"}, [el("h3", {}, ["Dòng thời gian"])]);
    ["inprogress", "pending", "done"].forEach(function(key){
      ganttHead.appendChild(el("span", {class:"gantt-legend", style:"--legend-color:" + STATUS_MAP[key].color + ";"}, [STATUS_MAP[key].label]));
    });
    ganttPanel.appendChild(ganttHead);
    var grid = el("div", {class:"gantt-grid"});
    var header = el("div", {class:"gantt-row is-header"}, [el("span", {class:"gantt-corner"}, ["Công việc"])]);
    days.forEach(function(dayMs){
      var isToday = dayMs === today;
      header.appendChild(el("button", {
        type:"button", class:"gantt-day" + (isToday ? " is-today" : ""), "aria-pressed":String(dayMs === selected),
        "aria-label":longDayLabel(dayMs) + (isToday ? ", hôm nay" : ""), onclick:function(){ selectCalendarDay(dayMs); }
      }, [
        el("span", {class:"gantt-day-wd"}, [isToday ? "Nay" : shortWeekday(dayMs)]),
        el("span", {class:"gantt-day-num"}, [String(new Date(dayMs).getDate())])
      ]));
    });
    grid.appendChild(header);
    var rows = state.tasks.map(function(task){ return {task:task, span:workSpan(task)}; }).filter(function(entry){
      if(entry.span.start === null) return false;
      var endIndex = dayDiff(startMs, entry.span.end !== null ? entry.span.end : now);
      return endIndex >= 0 && dayDiff(startMs, entry.span.start) <= 13;
    }).sort(function(a, b){ return a.span.start - b.span.start; });
    rows.forEach(function(entry){
      var task = entry.task;
      var span = entry.span;
      var endMs = span.end !== null ? span.end : now;
      var startIndex = dayDiff(startMs, span.start);
      var endIndex = dayDiff(startMs, endMs);
      var colDef = statusDef(task.status);
      var total = dayDiff(span.start, endMs) + 1;
      var rangeText = fmtDate(span.start).slice(0, 5) + " → " + (span.end !== null ? fmtDate(span.end).slice(0, 5) : "nay");
      var text = total >= 3 ? rangeText : (total === 2 ? "2 ngày" : "");
      var row = el("div", {class:"gantt-row", style:"--row-fill:" + colDef.color + ";--row-ink:" + colDef.ink + ";"});
      row.appendChild(el("button", {type:"button", class:"gantt-label", onclick:function(){ openTaskDetail(task.id); }}, [
        el("span", {class:"gantt-label-title", title:task.title}, [task.title]),
        el("span", {class:"gantt-label-status"}, [colDef.label])
      ]));
      days.forEach(function(dayMs, index){
        row.appendChild(el("span", {class:"gantt-cell" + (dayMs === selected ? " is-selected" : (dayMs === today ? " is-today" : "")), "aria-hidden":"true", style:"grid-column:" + (index + 2) + ";"}));
      });
      row.appendChild(el("span", {
        class:"gantt-bar" + (startIndex < 0 ? " cut-start" : "") + (endIndex > 13 ? " cut-end" : ""),
        style:"grid-column:" + (Math.max(0, startIndex) + 2) + " / " + (Math.min(13, endIndex) + 3) + ";",
        title:task.title + ": " + rangeText + " · " + total + " ngày"
      }, [text]));
      grid.appendChild(row);
    });
    var scroll = el("div", {class:"gantt-scroll drag-scroll"}, [grid]);
    ganttPanel.appendChild(el("span", {class:"table-scroll-hint"}, ["Kéo ngang để xem đủ hai tuần →"]));
    ganttPanel.appendChild(scroll);
    if(!rows.length) ganttPanel.appendChild(el("div", {class:"empty-hint"}, ["Chưa có việc nào được làm trong hai tuần này."]));
    layout.appendChild(ganttPanel);

    var dayEnd = selected + DAY_MS - 1;
    var future = selected > today;
    var working = future ? [] : state.tasks.filter(function(task){ return workedOnDay(task, selected) && !doneOnDay(task, selected); }).map(function(task){
      var statusKey = statusAtTime(task, Math.min(dayEnd, now)).status;
      var chip = spanLabelForDay(task, selected);
      return agendaItem(task, statusKey, statusDef(statusKey).label + (selected === today ? "" : " vào cuối ngày"), {text:chip || "Trong ngày", chip:true});
    });
    var finished = state.tasks.filter(function(task){ return doneOnDay(task, selected); }).map(function(task){
      var entry = sortedHistory(task).filter(function(h){ return h.to === "done" && dayStartMs(h.at) === selected; }).pop();
      var chip = spanLabelForDay(task, selected);
      return agendaItem(task, "done", chip ? "Hoàn thành sau " + chip.split("/")[1] + " ngày" : "Hoàn thành trong ngày", {text:fmtDateTime(entry.at).slice(11)});
    });
    var scheduled = state.tasks.filter(function(task){
      return task.status !== "trash" && dayStartMs(occurrenceDateOf(task)) === selected;
    }).map(function(task){
      return agendaItem(task, task.status, statusDef(task.status).label, null);
    });
    var events = [];
    state.tasks.forEach(function(task){
      var history = sortedHistory(task);
      history.forEach(function(entry, index){
        if(dayStartMs(entry.at) !== selected) return;
        events.push({at:new Date(entry.at).getTime(), task:task, text:historyEventText(entry, history[index - 1]), status:entry.to});
      });
    });
    events.sort(function(a, b){ return a.at - b.at; });
    var agenda = el("aside", {class:"panel agenda-panel", "aria-label":"Nhật ký ngày"});
    agenda.appendChild(el("div", {}, [
      el("div", {class:"agenda-kicker"}, ["Nhật ký ngày"]),
      el("h3", {class:"agenda-title"}, [longDayLabel(selected)]),
      el("p", {class:"agenda-summary"}, [future
        ? "Ngày chưa tới. Các việc đã lên lịch hiện ở dưới."
        : working.length + " việc đang làm · " + finished.length + " việc hoàn thành · " + events.length + " thay đổi"])
    ]));

  // dải "Theo ngày" trong chi tiết: trạng thái cuối mỗi ngày, từ ngày tạo tới ngày kết thúc (hoặc hôm nay)
  function buildDetailDays(task){
    var span = workSpan(task);
    var history = sortedHistory(task);
    if(span.start === null || !history.length) return null;
    var startMs = Math.min(new Date(history[0].at).getTime(), span.start);
    var endMs = span.end !== null ? span.end : Date.now();
    var total = dayDiff(startMs, endMs) + 1;
    if(total < 2) return null;
    var row = el("div", {class:"detail-days-row drag-scroll wheel-x", tabindex:"0", role:"region", "aria-label":"Trạng thái theo từng ngày, kéo hoặc dùng phím mũi tên để xem thêm"});
    var first = new Date(dayStartMs(startMs));
    for(var index = 0; index < total; index++){
      var day = new Date(first);
      day.setDate(first.getDate() + index);
      var statusKey = statusAtTime(task, Math.min(day.getTime() + DAY_MS - 1, Date.now())).status;
      var colDef = statusDef(statusKey);
      row.appendChild(el("div", {class:"detail-day", style:"--row-fill:" + colDef.color + ";--row-ink:" + colDef.ink + ";", title:longDayLabel(day.getTime()) + ": " + colDef.label}, [
        el("span", {class:"detail-day-label"}, [shortWeekday(day.getTime()) + " " + pad(day.getDate()) + "/" + pad(day.getMonth() + 1)]),
        el("span", {class:"detail-day-bar", "aria-hidden":"true"}),
        el("span", {class:"detail-day-status"}, [colDef.label])
      ]));
    }
    return el("div", {class:"detail-days"}, [
      el("div", {class:"detail-days-head"}, [
        el("span", {class:"detail-days-title"}, ["Theo ngày · " + fmtDate(startMs).slice(0, 5) + " → " + (span.end !== null ? fmtDate(span.end).slice(0, 5) : "nay") + " · " + total + " ngày"]),
        el("button", {type:"button", class:"link-btn", onclick:function(){
          closeModal();
          state.view = "calendar";
          state.calendarDay = toolbarDateValue(new Date(span.start));
          render();
        }}, ["Xem trên lịch"])
      ]),
      row
    ]);
  }
