        list.querySelectorAll(".task-card").forEach(function(card){ existingIds[card.getAttribute("data-task-id")] = true; });
        desiredTasks.forEach(function(t){
          if(!existingIds[t.id]) list.appendChild(buildWorkTaskCard(t, columnInfo.colDef));
        });
        applyColumnSearch(columnInfo.column, state.workSearchByStatus[statusKey]);
      });
    }
    STATUSES.forEach(function(colDef, colIdx){
      var colTasks = visible.filter(function(t){ return t.status === colDef.key; });
      var column = el("div", {class:"column fade-in", style:
        "border-top-color:"+colDef.color+";background:"+colDef.color+"0d;animation-delay:"+(colIdx*0.06)+"s;"
      });
      var head = el("div", {class:"column-head", style:"background:"+colDef.color+"1c"});
      head.appendChild(el("h3", {style:"color:"+colDef.color}, [colDef.label]));
      head.appendChild(el("span", {class:"count-badge", style:"background:"+colDef.color}, [String(colTasks.length)]));
      var columnSearch = el("input", {
        type:"search",
        value:(state.workSearchByStatus && state.workSearchByStatus[colDef.key]) || "",
        placeholder:"Tìm công việc...",
        "aria-label":"Tìm trong trạng thái " + colDef.label,
        class:"column-search",
        style:"--search-color:"+colDef.color+";"
      });
      columnSearch.addEventListener("input", function(){
        state.workSearchByStatus[colDef.key] = columnSearch.value;
        applyColumnSearch(column, columnSearch.value);
      });
      column.appendChild(head);
      column.appendChild(columnSearch);

      if(colDef.key === "todo"){
        var quick = el("div", {class:"quick-add"});
        var input = el("input", {type:"text", placeholder:"+ Thêm việc, Enter để lưu"});
        input.addEventListener("keydown", function(e){
          if(e.key === "Enter"){
            addTask(input.value, colDef.key);
            input.value = "";
            render();
            setTimeout(function(){
              var el2 = document.querySelector(".quick-add input");
              if(el2) el2.focus();
            }, 0);
          }
        });
        quick.appendChild(input);
        column.appendChild(quick);
      }

      var list = el("div", {class:"card-list"});
      list.addEventListener("dragover", function(e){ e.preventDefault(); list.classList.add("drag-over"); });
      list.addEventListener("dragleave", function(){ list.classList.remove("drag-over"); });
      list.addEventListener("drop", function(e){
        e.preventDefault();
        list.classList.remove("drag-over");
        var id = e.dataTransfer.getData("text/plain");
        var movingTask = getTaskById(id);
        if(!movingTask) return;
        var card = board.querySelector('[data-task-id="' + id + '"]');
        if(!canChangeStatus(movingTask.status, colDef.key)){
          var suggestedStatusKey = getSuggestedStatusKey(movingTask.status);
          var warningMessage = [
            "Không thể chuyển công việc từ ", statusBadge(movingTask.status),
            " sang ", statusBadge(colDef.key), ". "
          ];
          if(suggestedStatusKey){
            warningMessage.push("Vui lòng chuyển sang ", statusBadge(suggestedStatusKey), " trước.");
          } else {
            warningMessage.push("Vui lòng chọn trạng thái phù hợp trước.");
          }
          showConfirm(warningMessage, {title:"Không thể chuyển trạng thái", cancelLabel:"Đóng", okLabel:"Đã hiểu"});
          return;
        }
        if(!setStatus(id, colDef.key)) return;
        if(card){
          var storedTask = materializeDisplayTask(movingTask);
          card.setAttribute("data-task-id", storedTask.id);
          card.setAttribute("data-virtual", "false");
          list.appendChild(card);
          refreshCardProgress(card, colDef);
          applyColumnSearch(column, state.workSearchByStatus[colDef.key]);
          var trashCardList = board.querySelector(".trash-column > .card-list");
          if(trashCardList && !trashCardList.querySelector(".task-card") && !trashCardList.querySelector(".trash-empty-hint")){
            trashCardList.appendChild(el("div", {class:"trash-empty-hint"}, ["Kéo công việc vào đây để xóa"]));
          }
          refreshColumnCounts();
        }
      });

      colTasks.forEach(function(t){
        list.appendChild(buildWorkTaskCard(t, colDef));
      });

      column.appendChild(list);
      workColumns[colDef.key] = {column:column, list:list, colDef:colDef};
      applyColumnSearch(column, state.workSearchByStatus[colDef.key]);

      board.appendChild(column);
    });
    refreshColumnCounts();

    // trash column — drag a card here to delete it
    var trashTasks = state.tasks.filter(function(t){ return t.status === "trash"; });
    var trashColumn = el("div", {class:"trash-column fade-in", style:"animation-delay:"+(STATUSES.length*0.06)+"s;"});
    var trashHead = el("div", {class:"column-head"});
    trashHead.appendChild(el("h3", {style:"color:"+TRASH_STATUS.color}, [TRASH_STATUS.label]));
    trashHead.appendChild(el("span", {class:"count-badge", style:"background:"+TRASH_STATUS.color}, [String(trashTasks.length)]));
    trashColumn.appendChild(trashHead);

    var trashList = el("div", {class:"card-list"});
    trashList.addEventListener("dragover", function(e){ e.preventDefault(); trashList.classList.add("drag-over"); });
    trashList.addEventListener("dragleave", function(){ trashList.classList.remove("drag-over"); });
    trashList.addEventListener("drop", function(e){
      e.preventDefault();
      trashList.classList.remove("drag-over");
      var id = e.dataTransfer.getData("text/plain");
      var movingTask = getTaskById(id);
      if(!movingTask) return;
      var card = board.querySelector('[data-task-id="' + id + '"]');
      if(!setTaskToTrash(id)) return;
      if(card){
        var storedTask = materializeDisplayTask(movingTask);
        card.setAttribute("data-task-id", storedTask.id);
        card.setAttribute("data-virtual", "false");
        var emptyHint = trashList.querySelector(".trash-empty-hint");
        if(emptyHint) emptyHint.remove();
        trashList.appendChild(card);
        applyColumnSearch(trashColumn, state.workSearchByStatus.trash);
        var clearTrashButton = trashColumn.querySelector(".trash-clear button");
        if(clearTrashButton) clearTrashButton.removeAttribute("disabled");
        refreshColumnCounts();
      }
    });

    if(!trashTasks.length){
      trashList.appendChild(el("div", {class:"trash-empty-hint"}, ["Kéo công việc vào đây để xóa"]));
    } else {
      trashTasks.forEach(function(t){
        var card = el("div", {
          class:"task-card", draggable:"true", "data-task-id":t.id,
          "data-task-title":t.title.toLowerCase(), role:"button", tabindex:"0",
          "aria-label":"Mở công việc " + t.title + " trong thùng rác"
        });
        card.addEventListener("dragstart", function(e){
          e.dataTransfer.setData("text/plain", t.id);
          setTimeout(function(){ card.classList.add("dragging"); }, 0);
        });
        card.addEventListener("dragend", function(){ card.classList.remove("dragging"); });
        card.addEventListener("click", function(){ openTaskDetail(t.id); });
        card.addEventListener("keydown", function(e){
          if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openTaskDetail(t.id); }
        });
        card.appendChild(el("div", {class:"t-title"}, [t.title]));
        card.appendChild(el("div", {style:"font-size:11px;color:var(--text-dim);"}, [fmtDate(occurrenceDateOf(t))]));
        var recurrenceText = recurrenceLabel(t);
        if(recurrenceText) card.appendChild(el("div", {class:"task-recurrence"}, [recurrenceText]));
        trashList.appendChild(card);
      });
    }
    trashColumn.appendChild(trashList);
    var trashSearch = el("input", {
      type:"search",
      value:(state.workSearchByStatus && state.workSearchByStatus.trash) || "",
      placeholder:"Tìm công việc...",
      "aria-label":"Tìm trong thùng rác",
      class:"column-search",
      style:"--search-color:"+TRASH_STATUS.color+";"
    });
    trashSearch.addEventListener("input", function(){
      state.workSearchByStatus.trash = trashSearch.value;
      applyColumnSearch(trashColumn, trashSearch.value);
    });
    trashColumn.insertBefore(trashSearch, trashList);

    var trashClear = el("div", {class:"trash-clear"});
    var clearBtnAttrs = {
      class:"btn btn-outline",
      onclick: function(){
        var currentTrashTasks = state.tasks.filter(function(task){ return task.status === "trash"; });
        if(!currentTrashTasks.length) return;
        showConfirm("Xóa vĩnh viễn " + currentTrashTasks.length + " công việc trong thùng rác? Hành động này không thể hoàn tác.", {
          title: "Dọn thùng rác",
          okLabel: "Xóa vĩnh viễn",
          onOk: function(){
            emptyTrash();
            render();
          }
        });
      }
    };
    if(!trashTasks.length) clearBtnAttrs.disabled = "disabled";
    trashClear.appendChild(el("button", clearBtnAttrs, ["Dọn thùng rác"]));
    trashColumn.appendChild(trashClear);

    board.appendChild(trashColumn);
    applyColumnSearch(trashColumn, state.workSearchByStatus.trash);
    refreshColumnCounts();

    container.appendChild(board);
    state.workViewApi = {
      setPeriod:function(period){
        activeWorkRange = getRange(period, state.workFrom, state.workTo, state.workAnchorDate);
        var periodKeys = ["today", "week", "month", "year"];
        toolbar.querySelectorAll(".period-quick-button").forEach(function(button, index){
          button.className = "period-quick-button" + (periodKeys[index] === period ? " active" : "");
        });
        syncToolbarRange("work", toolbar);
        syncWorkBoardTasks();
        board.querySelectorAll(".column,.trash-column").forEach(function(column){
          var key = column.querySelector(".column-search");
          applyColumnSearch(column, key ? key.value : "");
        });
      },
      refreshDate:function(){
        activeWorkRange = getRange(state.workPeriod, state.workFrom, state.workTo, state.workAnchorDate);
        var periodKeys = ["today", "week", "month", "year"];
        toolbar.querySelectorAll(".period-quick-button").forEach(function(button, index){
          button.className = "period-quick-button" + (periodKeys[index] === state.workPeriod ? " active" : "");
        });
        syncToolbarRange("work", toolbar);
        syncWorkBoardTasks();
        board.querySelectorAll(".column,.trash-column").forEach(function(column){
          var key = column.querySelector(".column-search");
          applyColumnSearch(column, key ? key.value : "");
        });
      },
      refreshRange:function(){
        activeWorkRange = getRange(state.workPeriod, state.workFrom, state.workTo, state.workAnchorDate);
        syncWorkBoardTasks();
        board.querySelectorAll(".column,.trash-column").forEach(function(column){
          var key = column.querySelector(".column-search");
          applyColumnSearch(column, key ? key.value : "");
        });
      }
    };
    app.appendChild(container);
  }

  function taskRowAttrs(taskId){
    return {
      role:"button", tabindex:"0",
      onclick:function(){ openTaskDetail(taskId); },
      onkeydown:function(e){
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          openTaskDetail(taskId);
        }
      }
    };
  }

  function renderReportView(existingContainer){
    var isRefresh = !!existingContainer;
    var container = existingContainer || el("div", {class:"report-view"});
    if(!existingContainer){
      container.appendChild(el("div", {class:"view-heading"}, [
        el("div", {}, [el("h2", {}, ["Báo cáo"]),
          el("p", {}, ["Bức tranh công việc rõ ràng trong khoảng thời gian bạn chọn."])])
      ]));
    }
    var toolbar = container.querySelector(".toolbar");
    if(!toolbar){
      toolbar = el("div", {class:"toolbar"});
      toolbar.appendChild(periodButtons([
        {key:"today", label:"Ngày"},
        {key:"week", label:"Tuần"},
        {key:"month", label:"Tháng"},
        {key:"year", label:"Năm"}
      ], state.reportPeriod, changeReportPeriod, "report"));
      container.appendChild(toolbar);
    } else {
      var periodKeys = ["today", "week", "month", "year"];
      toolbar.querySelectorAll(".period-quick-button").forEach(function(button, index){
        button.className = "period-quick-button" + (periodKeys[index] === state.reportPeriod ? " active" : "");
      });
      syncToolbarRange("report", toolbar);
    }
    var oldContent = container.querySelector(".report-content");
    if(oldContent) oldContent.remove();
    var reportContent = el("div", {class:"report-content"});

    var range = getRange(state.reportPeriod, state.reportFrom, state.reportTo, state.reportAnchorDate);
    var previousRange = getPreviousRange(state.reportPeriod, range);

    // duration report: tasks whose "done" event at is within range.
    // start = FIRST time it entered "inprogress" (khi bắt đầu làm), end = LAST time it entered "done"
    // (khi hoàn thành sau cùng) — tránh việc kéo qua lại gần lúc hoàn thành làm sai lệch thời gian tính.
    var durationRows = [];
    state.tasks.forEach(function(t){
      if(t.status !== "done") return; // chỉ tính việc ĐANG ở trạng thái Hoàn thành, không tính việc đã kéo ra khỏi đó
      var firstInProgressAt = null;
      var doneAt = null;
      t.history.forEach(function(h){
        if(h.to === "inprogress" && !firstInProgressAt) firstInProgressAt = h.at;
        if(h.to === "done") doneAt = h.at;
      });
      if(doneAt && inRange(doneAt, range)){
        durationRows.push({
          taskId: t.id,
          title: t.title,
          start: firstInProgressAt,
          end: doneAt,
          durationMs: firstInProgressAt ? (new Date(doneAt) - new Date(firstInProgressAt)) : null
        });
      }
    });
    durationRows.sort(function(a,b){ return new Date(b.end) - new Date(a.end); });

    // công việc thuộc kỳ hiện tại và kỳ trước để so sánh trong summary
    var currentSummaryTasks = getDisplayTasks(range).filter(function(t){
      return t.status !== "trash" && taskRelevantToRange(t, range);
    });
    var previousSummaryTasks = previousRange[0] ? getDisplayTasks(previousRange).filter(function(t){
      return t.status !== "trash" && taskRelevantToRange(t, previousRange);
    }) : [];

    // công việc cần làm TRONG KỲ đang chọn (chưa xong, liên quan tới khoảng thời gian đã lọc)
    var todoInRange = getDisplayTasks(range).filter(function(t){
      if(["todo","inprogress","pending"].indexOf(t.status) === -1) return false;
      return taskRelevantToRange(t, range);
    }).sort(function(a,b){ return new Date(b.createdAt) - new Date(a.createdAt); });

    var reminderRows = state.tasks.filter(function(t){
      return t.status !== "trash" && t.reminderAt && inRange(t.reminderAt, range);
    }).sort(function(a,b){ return new Date(a.reminderAt) - new Date(b.reminderAt); });

    var doneCount = currentSummaryTasks.filter(function(t){ return t.status === "done"; }).length;
    var completionRate = currentSummaryTasks.length
      ? Math.round(doneCount / currentSummaryTasks.length * 100) : 0;
    var insight = el("div", {class:"report-insight"});
    insight.appendChild(el("div", {class:"insight-copy"}, [
      el("span", {class:"insight-eyebrow"}, ["TIẾN ĐỘ KỲ NÀY"]),
      el("div", {class:"insight-title"}, [
        currentSummaryTasks.length ? completionRate + "% đã hoàn thành" : "Sẵn sàng bắt đầu"
      ]),
      el("p", {}, [currentSummaryTasks.length
        ? doneCount + "/" + currentSummaryTasks.length + " công việc hoàn thành · " + reminderRows.length + " lịch nhắc"
        : "Chưa có công việc trong kỳ. Hãy chọn kỳ khác hoặc thêm công việc mới."])
    ]));
    var insightActions = el("div", {class:"insight-actions"});
    insightActions.appendChild(el("div", {class:"insight-progress", role:"progressbar",
      "aria-label":"Tỷ lệ hoàn thành công việc", "aria-valuenow":String(completionRate),
      "aria-valuemin":"0", "aria-valuemax":"100"}, [
      el("span", {style:"width:"+completionRate+"%;"})
    ]));
    insightActions.appendChild(el("button", {class:"insight-link", type:"button", onclick:function(){
      state.view = "work";
      render();
    }}, ["Mở bảng công việc", " →"]));
    insight.appendChild(insightActions);
    reportContent.appendChild(insight);

    // các thẻ tóm tắt theo trạng thái
    var summaryRow = el("div", {class:"report-summary"});
    [
      {label:"Tổng số công việc", color:"var(--pink-dark)"},
      {label:"Đang thực hiện", status:"inprogress", color:"#e0378f"},
      {label:"Chờ phê duyệt", status:"pending", color:"#8b5cf6"},
      {label:"Hoàn thành", status:"done", color:"#22c55e"}
    ].forEach(function(item, index){
      var tasks = item.status
        ? currentSummaryTasks.filter(function(t){ return t.status === item.status; })
        : currentSummaryTasks;
      var previousTasks = item.status
        ? previousSummaryTasks.filter(function(t){ return t.status === item.status; })
        : previousSummaryTasks;
      var comparison = summaryComparison(tasks.length, previousTasks.length, !!previousRange[0]);
      summaryRow.appendChild(el("button", {
        type:"button", class:"stat-card clickable fade-in", style:"--stat-color:"+item.color+";",
        onclick:function(){ renderTaskListModal(item.label, tasks); }
      }, [
        el("div", {class:"stat-card-head"}, [
          el("span", {class:"lbl"}, [item.label]),
          el("span", {class:"stat-card-arrow", "aria-hidden":"true"}, ["↗"])
        ]),
        el("div", {class:"num"}, [String(tasks.length)]),
        el("div", {class:"compare", style:"color:"+comparison.color+";"}, [comparison.text])
      ]));
    });
    reportContent.appendChild(summaryRow);

    var topRow = el("div", {class:"report-top-grid"});

    // tỷ lệ công việc theo trạng thái: 1/4 chiều rộng
    var panelChart = el("div", {class:"panel fade-in", style:"animation-delay:.06s;padding:20px;"});
    panelChart.appendChild(el("h3", {style:"font-size:13px;"}, ["Tỷ lệ công việc theo trạng thái"]));
    panelChart.appendChild(buildStatusDonut(currentSummaryTasks));
    topRow.appendChild(panelChart);

    // danh sách công việc đã hoàn thành: thay cho danh sách công việc cần làm trong kỳ
    var panelCompleted = el("div", {class:"panel report-todo-panel fade-in", style:"animation-delay:.12s;"});
    panelCompleted.appendChild(el("h3", {}, ["Công việc đã hoàn thành"]));
    if(!durationRows.length){
      panelCompleted.appendChild(el("div", {class:"empty-hint"}, ["Chưa có công việc nào hoàn thành trong khoảng thời gian này."]));
    } else {
      var completedWrap = el("div", {class:"clickable-table report-todo-list"});
      var completedTable = el("table");
      completedTable.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", {}, ["Tên việc"]),
        el("th", {}, ["Bắt đầu"]),
        el("th", {}, ["Hoàn thành"]),
        el("th", {}, ["Thời gian xử lý"])
      ])]));
      var completedBody = el("tbody");
      durationRows.forEach(function(r){
        completedBody.appendChild(el("tr", taskRowAttrs(r.taskId), [
          el("td", {style:"font-weight:600;color:var(--text);"}, [r.title]),
          el("td", {style:"white-space:nowrap;color:var(--text-dim);"}, [r.start ? fmtDateTime(r.start) : "—"]),
          el("td", {style:"white-space:nowrap;color:var(--text-dim);"}, [fmtDateTime(r.end)]),
          el("td", {style:"white-space:nowrap;color:var(--text-dim);"}, [r.durationMs !== null ? durationText(r.durationMs) : "—"])
        ]));
      });
      completedTable.appendChild(completedBody);
      completedWrap.appendChild(completedTable);
      panelCompleted.appendChild(completedWrap);
    }
    topRow.appendChild(panelCompleted);

    reportContent.appendChild(topRow);

    // công việc cần làm và danh sách nhắc lịch phía dưới, mỗi panel 50%
    var bottomRow = el("div", {class:"report-bottom-grid"});
    var todoPanel = el("div", {class:"panel report-bottom-panel report-todo-panel fade-in", style:"animation-delay:.34s;"});
    todoPanel.appendChild(el("h3", {}, ["Công việc cần làm"]));
    if(!todoInRange.length){
      todoPanel.appendChild(el("div", {class:"empty-hint"}, ["Không có việc nào cần làm trong khoảng thời gian này."]));
    } else {
      var todoWrap = el("div", {class:"report-table-scroll clickable-table"});
      var todoTable = el("table");
      todoTable.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", {}, ["Tên công việc"]),
        el("th", {}, ["Trạng thái"]),
        el("th", {}, ["Ngày thực hiện"])
      ])]));
      var todoBody = el("tbody");
      todoInRange.forEach(function(t){
        todoBody.appendChild(el("tr", taskRowAttrs(t.id), [
          el("td", {style:"font-weight:600;color:var(--text);"}, [t.title]),
          el("td", {}, [statusBadge(t.status)]),
          el("td", {style:"white-space:nowrap;color:var(--text-dim);"}, [fmtDate(occurrenceDateOf(t))])
        ]));
      });
      todoTable.appendChild(todoBody);
      todoWrap.appendChild(todoTable);
      todoPanel.appendChild(todoWrap);
    }
    bottomRow.appendChild(todoPanel);

    var reminderPanel = el("div", {class:"panel report-bottom-panel fade-in", style:"animation-delay:.38s;"});
    reminderPanel.appendChild(el("h3", {}, ["Danh sách nhắc lịch"]));
    if(!reminderRows.length){
      reminderPanel.appendChild(el("div", {class:"empty-hint"}, ["Không có lịch nhắc nào trong khoảng thời gian này."]));
    } else {
      var reminderWrap = el("div", {class:"report-table-scroll clickable-table"});
      var reminderTable = el("table");
      reminderTable.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", {}, ["Tên công việc"]),
        el("th", {}, ["Trạng thái"]),
        el("th", {}, ["Nhắc lúc"])
      ])]));
      var reminderBody = el("tbody");
      reminderRows.forEach(function(t){
        var tr = el("tr", taskRowAttrs(t.id));
        tr.appendChild(el("td", {style:"font-weight:600;color:var(--text);"}, [t.title]));
        tr.appendChild(el("td", {}, [statusBadge(t.status)]));
        tr.appendChild(el("td", {style:"white-space:nowrap;color:var(--text-dim);"}, [fmtDateTime(t.reminderAt)]));
        reminderBody.appendChild(tr);
      });
      reminderTable.appendChild(reminderBody);
      reminderWrap.appendChild(reminderTable);
      reminderPanel.appendChild(reminderWrap);
    }
    bottomRow.appendChild(reminderPanel);
    reportContent.appendChild(bottomRow);

    container.appendChild(reportContent);
    if(!isRefresh) app.appendChild(container);
    state.reportViewApi = {
      refresh:function(){
        var currentView = app.querySelector(".report-view");
        if(currentView) renderReportView(currentView);
        else render();
      }
    };
  }

  // ---------- task detail modal ----------
  function renderTaskModal(){
    var task = getTaskById(state.activeTaskId);
    if(!task){ modalRoot.innerHTML = ""; return; }

    var overlay = el("div", {class:"modal-overlay", onclick: function(e){ if(e.target === overlay) closeModal(); }});
    var modal = el("div", {class:"modal modal-detail"});

    var header = el("div", {class:"modal-header"});
    header.appendChild(el("h2", {}, ["Chi tiết công việc"]));
    header.appendChild(el("button", {class:"icon-btn", onclick: closeModal}, ["✕"]));
    modal.appendChild(header);

    var body = el("div", {class:"modal-body"});
    var cols = el("div", {class:"modal-2col"});
    var colLeft = el("div", {class:"col-left"});
    var colRight = el("div", {class:"col-right"});

    var titleField = el("div", {class:"field"});
    titleField.appendChild(el("label", {}, ["Tên công việc"]));
    var titleInput = el("input", {type:"text", value: task.title});
    titleField.appendChild(titleInput);
    colLeft.appendChild(titleField);

    var row2 = el("div", {class:"row2"});
    var statusField = el("div", {class:"field"});
    statusField.appendChild(el("label", {}, ["Trạng thái"]));
    var selectedStatus = task.status;
    var statusTransitionError = el("div", {class:"field-error"}, []);
    function refreshStatusValidation(){
      var valid = canChangeStatus(task.status, selectedStatus);
      statusTransitionError.textContent = getStatusTransitionGuide(task.status);
      statusTransitionError.classList.toggle("show", !valid);
    }
    var statusSelect = createStatusDropdown(STATUSES.concat([TRASH_STATUS]), task.status, function(nextStatus){
      selectedStatus = nextStatus;
      refreshStatusValidation();
    });
    statusField.appendChild(statusSelect);
    statusField.appendChild(statusTransitionError);
    row2.appendChild(statusField);

    var createdField = el("div", {class:"field"});
    createdField.appendChild(el("label", {}, [isRecurringTask(task) ? "Ngày thực hiện" : "Ngày tạo"]));
    createdField.appendChild(el("input", {type:"text", value: fmtDateTime(occurrenceDateOf(task)), disabled:"disabled"}));
    if(isRecurringTask(task)) createdField.appendChild(el("p", {class:"recurrence-note"}, [
      recurrenceLabel(task) + " · Chỉnh sửa chỉ áp dụng cho ngày này."
    ]));
    row2.appendChild(createdField);
    colLeft.appendChild(row2);

    var reminderField = el("div", {class:"field"});
    reminderField.appendChild(el("label", {}, ["Nhắc nhở"]));

    var reminderInput = el("input", {type:"datetime-local", value: task.reminderAt ? toDatetimeLocalValue(task.reminderAt) : "", style:"width:100%;"});

    var quickRow = el("div", {class:"quick-reminder-row"});
    [
      {label:"Không", clear:true},
      {label:"15 phút", mins:15},
      {label:"30 phút", mins:30},
      {label:"1 giờ", mins:60},
      {label:"1 ngày", mins:1440},
      {label:"2 ngày", mins:2880}
    ].forEach(function(p){
      quickRow.appendChild(el("button", {
        type:"button", class:"quick-reminder-btn",
        onclick:function(){
          reminderInput.value = p.clear ? "" : toDatetimeLocalValue(new Date(Date.now() + p.mins*60000).toISOString());
          clearReminderError();
        }
      }, [p.label]));
    });
    reminderField.appendChild(quickRow);

    var reminderRow = el("div", {style:"display:flex;align-items:center;gap:10px;margin-top:8px;"});
    reminderRow.appendChild(reminderInput);
    reminderField.appendChild(reminderRow);
    var reminderError = el("div", {class:"field-error"}, ["Thời gian nhắc nhở phải ở trong tương lai."]);
    reminderField.appendChild(reminderError);
    function clearReminderError(){
      reminderError.classList.remove("show");
      reminderInput.classList.remove("input-invalid");
    }
    reminderInput.addEventListener("input", clearReminderError);
    colLeft.appendChild(reminderField);

    var descField = el("div", {class:"field"});
    descField.appendChild(el("label", {}, ["Ghi chú"]));
    var descArea = el("textarea", {style:"min-height:140px;"}, [task.description || ""]);
    descField.appendChild(descArea);
    colLeft.appendChild(descField);

    var histField = el("div", {class:"field", style:"margin-bottom:0;"});
    histField.appendChild(el("label", {}, ["Lịch sử hoạt động"]));
    var histList = el("div", {class:"history-list"});
    var historyEdits = [];
    task.history.slice().reverse().forEach(function(h){
      var item = el("div", {class:"history-item"});
      var historyTimeCell = el("div", {class:"history-time-cell"});
      var historyTimeText = el("span", {class:"h-time"}, [fmtDateTime(h.at)]);
      var historyTimeInput = el("input", {
        type:"datetime-local",
        class:"history-time-input",
        value:toDatetimeLocalValue(h.at),
        title:"Chỉnh thời gian hoạt động"
      });
      var historyRowError = el("div", {class:"history-row-error"}, []);
      var historyEdit = {history:h, input:historyTimeInput, item:item, draftIso:h.at, error:historyRowError};
      historyEdits.push(historyEdit);
      historyTimeCell.appendChild(historyTimeText);
      historyTimeCell.appendChild(historyTimeInput);
      historyTimeCell.appendChild(historyRowError);
      item.appendChild(historyTimeCell);
      var historyStatusCell = el("div", {class:"history-status-cell"});
      if(h.from !== null){
        historyStatusCell.appendChild(statusBadge(h.from));
        historyStatusCell.appendChild(el("span", {class:"h-arrow"}, ["→"]));
      }
      historyStatusCell.appendChild(statusBadge(h.to));
      item.appendChild(historyStatusCell);
      var historyActions = el("div", {class:"history-actions"});
      var historyEditButton = el("button", {type:"button", class:"history-edit-btn", title:"Sửa thời gian", "aria-label":"Sửa thời gian hoạt động"}, ["✎"]);
      var historyConfirmButton = el("button", {type:"button", class:"history-confirm-btn", title:"Xác nhận chỉnh sửa", "aria-label":"Xác nhận chỉnh sửa thời gian hoạt động"}, ["✓"]);
      var historyCancelButton = el("button", {type:"button", class:"history-cancel-btn", title:"Hủy sửa", "aria-label":"Hủy sửa thời gian hoạt động"}, ["×"]);
      historyEditButton.addEventListener("click", function(){
        item.classList.add("is-editing");
        historyEditButton.style.display = "none";
        historyConfirmButton.style.display = "inline-flex";
        historyCancelButton.style.display = "inline-flex";
        historyTimeInput.focus();
        validateHistoryOrder(true, historyEdit);
      });
      historyConfirmButton.addEventListener("click", function(){
        if(!validateHistoryOrder(true, historyEdit)) return;
        var iso = historyEditIso(historyEdit);
        if(!iso) return;
        historyEdit.draftIso = iso;
        historyTimeInput.value = toDatetimeLocalValue(iso);
        historyTimeText.textContent = fmtDateTime(iso);
        item.classList.remove("is-editing");
        historyEditButton.style.display = "inline-flex";
        historyConfirmButton.style.display = "none";
        historyCancelButton.style.display = "none";
      });
      historyCancelButton.addEventListener("click", function(){
        historyTimeInput.value = toDatetimeLocalValue(historyEdit.draftIso);
        historyTimeText.textContent = fmtDateTime(historyEdit.draftIso);
        item.classList.remove("is-editing");
        historyEditButton.style.display = "inline-flex";
        historyConfirmButton.style.display = "none";
        historyCancelButton.style.display = "none";
        validateHistoryOrder(false);
      });
      historyConfirmButton.style.display = "none";
      historyCancelButton.style.display = "none";
      historyActions.appendChild(historyEditButton);
      historyActions.appendChild(historyConfirmButton);
      historyActions.appendChild(historyCancelButton);
      item.appendChild(historyActions);
      histList.appendChild(item);
    });
    histField.appendChild(histList);
    function historyEditIso(edit){
      var currentInputValue = edit.input.value;
      var draftInputValue = toDatetimeLocalValue(edit.draftIso);
      return currentInputValue === draftInputValue ? edit.draftIso : fromDatetimeLocalValue(currentInputValue);
    }
    function validateHistoryOrder(showError, activeEdit){
      var orderedHistoryTimes = task.history.map(function(history){
        var edit = historyEdits.find(function(item){ return item.history === history; });
        return edit ? historyEditIso(edit) : history.at;
      });
      var valid = true;
      historyEdits.forEach(function(edit){
        edit.input.classList.remove("input-invalid");
        edit.error.classList.remove("show");
        edit.error.textContent = "";
      });
      orderedHistoryTimes.forEach(function(iso, index){
        if(!iso){
          valid = false;
          var emptyEdit = historyEdits.find(function(item){ return item.history === task.history[index]; });
          if(emptyEdit){
            emptyEdit.input.classList.add("input-invalid");
            emptyEdit.error.textContent = "Vui lòng nhập thời gian.";
            if(showError && emptyEdit.item.classList.contains("is-editing")) emptyEdit.error.classList.add("show");
          }
          return;
        }
        if(index > 0 && new Date(iso).getTime() < new Date(orderedHistoryTimes[index - 1]).getTime()){
          valid = false;
          var currentEdit = historyEdits.find(function(item){ return item.history === task.history[index]; });
          if(currentEdit){
            currentEdit.input.classList.add("input-invalid");
            currentEdit.error.textContent = "Thời gian hoạt động phải bằng hoặc sau hoạt động trước.";
            if(showError && currentEdit.item.classList.contains("is-editing")) currentEdit.error.classList.add("show");
          }
        }
      });
      return valid;
    }
    historyEdits.forEach(function(edit){
      edit.input.addEventListener("input", function(){ validateHistoryOrder(true, edit); });
    });
    validateHistoryOrder(false);
    colRight.appendChild(histField);

    cols.appendChild(colLeft);
    cols.appendChild(colRight);
    body.appendChild(cols);

    modal.appendChild(body);

    var footer = el("div", {class:"modal-footer"});
    footer.appendChild(el("button", {class:"btn btn-danger", onclick: function(){
      var seriesMates = task.recurrenceId
        ? state.tasks.filter(function(t){ return t.recurrenceId === task.recurrenceId && t.id !== task.id; })
        : [];
      if(seriesMates.length || isRecurringTask(task)){
        showConfirm("Công việc " + task.title + " thuộc một chuỗi lặp lại. Bạn muốn xóa thế nào?", {
          title: "Xóa công việc lặp lại",
          okLabel: "Chỉ xóa việc này",
          extraLabel: "Xóa cả chuỗi",
          onOk: function(){
            deleteTask(task.id);
            state.activeTaskId = null;
            render();
          },
          onExtra: function(){
            deleteRecurringSeries(task.recurrenceId);
            state.activeTaskId = null;
            render();
          }
        });
      } else {
        showConfirm("Bạn có chắc muốn xóa công việc \"" + task.title + "\"? Hành động này không thể hoàn tác.", {
          title: "Xóa công việc",
          okLabel: "Xóa công việc",
          onOk: function(){
            deleteTask(task.id);
            state.activeTaskId = null;
            render();
          }
        });
      }
    }}, ["Xóa công việc"]));

    var rightBtns = el("div", {});
    rightBtns.appendChild(el("button", {class:"btn btn-outline", style:"margin-right:8px;", onclick: closeModal}, ["Đóng lại"]));
    rightBtns.appendChild(el("button", {class:"btn btn-primary", onclick: function(){
      var editingHistory = historyEdits.filter(function(edit){ return edit.item.classList.contains("is-editing"); });
      if(editingHistory.length){
        editingHistory.forEach(function(edit){
          edit.error.textContent = "Vui lòng nhấn ✓ để xác nhận hoạt động đang sửa trước khi lưu.";
          edit.error.classList.add("show");
        });
        return;
      }
      if(!validateHistoryOrder(false)) return;
      var historyTimes = [];
      historyEdits.forEach(function(edit){
        var iso = historyEditIso(edit);
        historyTimes.push({index:task.history.indexOf(edit.history), iso:iso});
      });
      var reminderIso = fromDatetimeLocalValue(reminderInput.value);
      var originalLocal = task.reminderAt ? toDatetimeLocalValue(task.reminderAt) : "";
      var reminderChanged = reminderInput.value !== originalLocal;
      if(reminderChanged && reminderIso && new Date(reminderIso).getTime() <= Date.now()){
        reminderError.classList.add("show");
        reminderInput.classList.add("input-invalid");
        reminderInput.focus();
        return;
      }
      var newStatus = selectedStatus;
      if(newStatus !== task.status && !canChangeStatus(task.status, newStatus)){
        refreshStatusValidation();
        return;
      }
      updateTaskHistoryTimes(task.id, historyTimes);
      updateTaskFields(task.id, titleInput.value.trim() || task.title, descArea.value, reminderIso);
      if(newStatus !== task.status){
        if(newStatus === "trash"){
          moveTaskToTrash(task.id, function(){ state.activeTaskId = null; });
          return;
        }
        if(!setStatus(task.id, newStatus)){
          refreshStatusValidation();
          return;
        }
      }
      state.activeTaskId = null;
      render();
    }}, ["Lưu thay đổi"]));
    footer.appendChild(rightBtns);
    modal.appendChild(footer);

    overlay.appendChild(modal);
    modalRoot.innerHTML = "";
    modalRoot.appendChild(overlay);
  }

  function closeModal(){
    state.activeTaskId = null;
    state.bulkOpen = false;
    modalRoot.innerHTML = "";
  }
  function openTaskDetail(taskId){
    var task = getTaskById(taskId);
    if(!task) return;
    state.activeTaskId = task.id;
    renderTaskModal();
  }

  // ---------- bulk add modal ----------
  function openBulkModal(){
    state.bulkOpen = true;
    renderBulkModal();
  }
  function renderBulkModal(){
    var overlay = el("div", {class:"modal-overlay", onclick:function(e){ if(e.target===overlay) closeModal(); }});
    var modal = el("div", {class:"modal modal-lg"});

    var header = el("div", {class:"modal-header"});
    header.appendChild(el("h2", {}, ["Thêm nhiều việc cùng lúc"]));
    header.appendChild(el("button", {class:"icon-btn", onclick: closeModal}, ["✕"]));
    modal.appendChild(header);

    var body = el("div", {class:"modal-body"});
    var field = el("div", {class:"field"});
    field.appendChild(el("label", {}, ["Mỗi dòng là một công việc"]));
    var area = el("textarea", {class:"textarea-lines", placeholder:"Nhập danh sách công việc..."});
    field.appendChild(area);
    body.appendChild(field);

    var row1 = el("div", {class:"row2"});
    var dateField = el("div", {class:"field"});
    dateField.appendChild(el("label", {}, ["Ngày thực hiện"]));
    var dateInput = el("input", {type:"date", value: todayDateValue()});
    dateField.appendChild(dateInput);
    row1.appendChild(dateField);

    var repeatField = el("div", {class:"field"});
    repeatField.appendChild(el("label", {}, ["Lặp lại"]));
    var repeatSelect = el("select");
    [
      {value:"none", label:"Không lặp"},
      {value:"daily", label:"Hàng ngày"},
      {value:"weekly", label:"Hàng tuần"},
      {value:"monthly", label:"Hàng tháng"},
      {value:"yearly", label:"Hằng năm"}
    ].forEach(function(o){ repeatSelect.appendChild(el("option", {value:o.value}, [o.label])); });
    repeatField.appendChild(repeatSelect);
    repeatField.appendChild(el("p", {class:"field-hint"}, [
      "Lịch lặp không giới hạn. Mỗi lần chỉ lưu riêng khi bạn chỉnh sửa."
    ]));
    row1.appendChild(repeatField);
    body.appendChild(row1);

    modal.appendChild(body);

    var footer = el("div", {class:"modal-footer"});
    footer.appendChild(el("span", {}));
    var rightBtns = el("div", {});
    rightBtns.appendChild(el("button", {class:"btn btn-outline", style:"margin-right:8px;", onclick: closeModal}, ["Hủy bỏ"]));
    rightBtns.appendChild(el("button", {class:"btn btn-primary", onclick: function(){
      var lines = area.value.split("\n").map(function(l){ return l.trim(); }).filter(function(l){ return l.length; });
      if(!lines.length) return;
      var startIso = occurrenceStartDate(dateInput.value);
      lines.forEach(function(line){
        var seriesId = repeatSelect.value !== "none" ? uid() : null;
        var task = addTask(line, "todo", startIso, seriesId, false);
        if(task && seriesId){
          task.recurrenceRule = repeatSelect.value;
          task.recurrenceStart = startIso;
          task.recurrenceInitialStatus = "todo";
          task.occurrenceDate = startIso;
          state.series[seriesId] = {
            title:line, description:"", rule:repeatSelect.value,
            start:startIso, anchorDate:dateKey(startIso),
            initialStatus:"todo", excludedDates:[]
          };
        }
      });
      saveTasks();
      closeModal();
      render();
    }}, ["Thêm công việc"]));
    footer.appendChild(rightBtns);
    modal.appendChild(footer);

    overlay.appendChild(modal);
    modalRoot.innerHTML = "";
    modalRoot.appendChild(overlay);
  }

  // ---------- main render ----------
  function render(){
    app.innerHTML = "";
    state.workViewApi = null;
    state.reportViewApi = null;
    var workTab = document.getElementById("tab-work");
    var reportTab = document.getElementById("tab-report");
    workTab.className = "side-item" + (state.view === "work" ? " active" : "");
    reportTab.className = "side-item" + (state.view === "report" ? " active" : "");
    workTab.setAttribute("aria-pressed", String(state.view === "work"));
    reportTab.setAttribute("aria-pressed", String(state.view === "report"));
    if(state.view === "work") renderWorkView();
    else renderReportView();

    if(state.activeTaskId) renderTaskModal();
    else if(state.bulkOpen) renderBulkModal();
    else modalRoot.innerHTML = "";
  }

  document.getElementById("tab-work").addEventListener("click", function(){ state.view = "work"; render(); });
  document.getElementById("tab-report").addEventListener("click", function(){ state.view = "report"; render(); });

  // ---------- init ----------
  state.tasks = loadTasks();
  state.series = loadSeries();
  normalizeRecurringTasks();
  render();
  checkReminders();
  setInterval(checkReminders, 15000);
})();
</script>
</body>
</html>
